name: Update Chispazo Predictor V10 - pequeno sin regex
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: chispazo-v10
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bajar CSV
        run: |
          rm -f Chispazo.csv
          curl -L --fail -o Chispazo.csv "https://raw.githubusercontent.com/pakinja/pakin/master/Chispazo.csv" || curl -L -o Chispazo.csv "https://cdn.jsdelivr.net/gh/pakinja/pakin@master/Chispazo.csv"
          wc -l Chispazo.csv
          tail -n 3 Chispazo.csv

      - name: Generar pools
        run: |
          python3 generate_pools.py
          cat /tmp/pools.js || cat pools.js

      - name: Regenerar index sin regex greedy
        run: |
          python3 << 'PY'
          import pathlib, json, datetime, re
          from collections import defaultdict, Counter
          import csv as csvm
          csv_path=pathlib.Path('Chispazo.csv')
          rows=[]
          with open(csv_path, encoding='utf-8') as f:
              clean=[l for l in f if l.strip()!='']
              for r in csvm.DictReader(clean):
                  try:
                      c=int(r['CONCURSO']); R=[int(r['R1']),int(r['R2']),int(r['R3']),int(r['R4']),int(r['R5'])]
                      rows.append({"c":c,"R":R,"fecha":r['FECHA']})
                  except: continue
          rows.sort(key=lambda x: x["c"])
          max_c=rows[-1]['c']; next_c=max_c+1

          # Pools from /tmp/pools.js
          pools_path=pathlib.Path('/tmp/pools.js')
          if not pools_path.exists():
              pools_path=pathlib.Path('pools.js')
          pj=pools_path.read_text() if pools_path.exists() else ""
          def extract(name):
              m=re.search(rf'const {name}\s*=\s*\[(.*?)\];', pj, re.S)
              return f"[{m.group(1)}]" if m else "[]"
          Tr=extract('Tr'); zr=extract('zr'); Lr=extract('Lr'); Rr=extract('Rr')

          # Historial
          hist_path=pathlib.Path('history')
          hist_pools={}
          for jf in hist_path.glob('*.json'):
              try:
                  data=json.loads(jf.read_text())
                  s=data.get('sorteo')
                  if s: hist_pools[int(s)]=data.get('pools',{})
              except: pass

          meses=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"]
          def to_label(r):
              try:
                  d=datetime.datetime.strptime(r['fecha'],"%Y-%m-%d")
                  hour='15:00 hrs - De las Tres' if r['c']%2==0 else '21:00 hrs - Chispazo Clasico'
                  return f"{d.day:02d} {meses[d.month-1]} {d.year} - {hour}"
              except:
                  return str(r['c'])

          ultimos=sorted(rows, key=lambda x: x["c"], reverse=True)[:20]
          sorteos_list=[]
          for r in ultimos:
              label=to_label(r).replace("'","")
              sorteos_list.append(f"{{num:{r['c']},win:[{','.join(map(str,r['R']))}],date:'{label}'}}")
          sorteos_js="const sorteos=[\n"+",\n".join(sorteos_list)+"\n];"

          # Read current index.html as template but replace ONLY specific lines, not greedy whole file
          p=pathlib.Path('index.html')
          t=p.read_text(encoding='utf-8')

          # Replace only first occurrence of each const pool
          t=re.sub(r'const Tr=\[.*?\];', f'const Tr={Tr};', t, count=1, flags=re.S)
          t=re.sub(r'const zr=\[.*?\];', f'const zr={zr};', t, count=1, flags=re.S)
          t=re.sub(r'const Lr=\[.*?\];', f'const Lr={Lr};', t, count=1, flags=re.S)
          t=re.sub(r'const Rr=\[.*?\];', f'const Rr={Rr};', t, count=1, flags=re.S)
          t=re.sub(r'let sorteoNum=\d+;', f'let sorteoNum={next_c};', t, count=1)
          # Replace sorteos array - find with non-greedy but with DOTALL, limited to 5000 chars
          t=re.sub(r'const sorteos=\[.*?\];', sorteos_js, t, count=1, flags=re.S)
          # Replace HIST_POOLS
          if 'window.HIST_POOLS=' in t:
              t=re.sub(r'window\.HIST_POOLS=.*?;', f'window.HIST_POOLS={json.dumps(hist_pools)};', t, count=1, flags=re.S)
          # Pill and backtest
          try:
              base=datetime.datetime.strptime(rows[-1]['fecha'],"%Y-%m-%d")
              hour_label='21:00 hrs - Chispazo Clasico' if max_c%2==1 else '15:00 hrs - De las Tres'
              next_date=base if max_c%2==1 else base+datetime.timedelta(days=1)
              fmt_next=f"{next_date.day} {meses[next_date.month-1]} {next_date.year}"
              pill=f"{fmt_next} • {hour_label} • Sorteo {next_c}"
              t=re.sub(r'<span class="pill"[^>]*>[^<]*Sorteo \d+[^<]*</span>', f'<span class="pill" style="background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);color:var(--cyan)">{pill}</span>', t, count=1)
              t=re.sub(r'Backtesting \d+ sorteos \(\d+-\d+\)', f'Backtesting 200 sorteos ({next_c-201}-{next_c-1})', t, count=1)
              t=re.sub(r'<h2[^>]*>Sorteo\s+\d+</h2>', f'<h2 style="font-size:19px;font-weight:900">Sorteo {next_c}</h2>', t, count=1)
          except Exception as e:
              print(f"Pill error {e}")

          p.write_text(t, encoding='utf-8')
          print(f"OK updated index.html to {next_c} Tr {Tr[:30]}...")
          PY

      - name: Commit
        run: |
          if git diff --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "chispazo-bot"
          git config user.email "bot@github.com"
          git add index.html history/
          git commit -m "V10 sin corte: regenera index sin regex greedy, tabla llena, 12321=4/21 real"
          git pull --rebase origin main || true
          git push || git push origin main

