name: Update Chispazo Predictor V9 - regenera index completo
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: chispazo-v9
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bajar CSV multi-source
        run: |
          rm -f Chispazo.csv
          URL1="https://raw.githubusercontent.com/pakinja/pakin/refs/heads/master/Chispazo.csv?t=$(date +%s)&r=$RANDOM"
          URL2="https://raw.githubusercontent.com/pakinja/pakin/master/Chispazo.csv?t=$(date +%s)&r=$RANDOM"
          URL3="https://cdn.jsdelivr.net/gh/pakinja/pakin@master/Chispazo.csv?t=$(date +%s)"
          for URL in "$URL1" "$URL2" "$URL3"; do
            curl -L --fail --max-time 30 -H "Cache-Control: no-cache" -o Chispazo.csv "$URL" && break
            sleep 2
          done
          wc -l Chispazo.csv
          tail -n 3 Chispazo.csv

      - name: Regenerar historial y pools e index completo
        run: |
          python3 << 'PY'
          import pathlib, json, datetime
          from collections import defaultdict, Counter
          import csv as csvm

          csv_path=pathlib.Path('Chispazo.csv')
          rows=[]
          with open(csv_path, encoding='utf-8') as f:
              clean=[l for l in f if l.strip()!='']
              for r in csvm.DictReader(clean):
                  try:
                      c=int(r['CONCURSO']); R=[int(r['R1']),int(r['R2']),int(r['R3']),int(r['R4']),int(r['R5'])]
                      rows.append({"c":c,"R":R,"fecha":r['FECHA']})
                  except: continue
          rows.sort(key=lambda x: x["c"])
          print(f"CSV rows {len(rows)} max {rows[-1]['c'] if rows else 0}")

          def pool2(rows_up, decay=0.985):
              scores=defaultdict(float)
              for i, row in enumerate(reversed(rows_up[-200:])):
                  w=decay**i
                  for n in row["R"]:
                      scores[n]+=w
              s=sorted(scores.items(), key=lambda x: (x[1], -x[0]), reverse=True)
              return [n for n,_ in s[:21]]
          def pool3(rows_up):
              last_seen={}
              for row in rows_up:
                  for n in row["R"]:
                      last_seen[n]=row["c"]
              max_c_local=rows_up[-1]["c"] if rows_up else 0
              gaps=[(n, max_c_local-last_seen.get(n, max_c_local-100)) for n in range(1,29)]
              gaps.sort(key=lambda x: (x[1], -x[0]), reverse=True)
              Lr=[n for n,_ in gaps[:14]]
              zr=pool2(rows_up, decay=0.985)
              for n in zr:
                  if n not in Lr and len(Lr)<21:
                      Lr.append(n)
              return Lr
          def pool4(rows_up, stick_window=40):
              last=rows_up[-stick_window:]
              cnt=Counter()
              for r in last:
                  cnt.update(r["R"])
              last_seen={}
              for row in rows_up:
                  for n in row["R"]:
                      last_seen[n]=row["c"]
              max_c_local=rows_up[-1]["c"] if rows_up else 0
              scores=[]
              for n in range(1,29):
                  gap=max_c_local-last_seen.get(n,0)
                  rec=1/(1+gap*0.25)
                  score=rec*1.5 + cnt.get(n,0)*0.35 + (1/(1+gap))*0.6
                  scores.append((n,score))
              scores.sort(key=lambda x: (x[1], -x[0]), reverse=True)
              return [n for n,_ in scores[:21]]
          def pool_final(zr,Lr,Rr, weights=(3,1,2)):
              votes=defaultdict(float)
              for idx,lst in enumerate([zr,Lr,Rr]):
                  w=weights[idx]
                  for pos,num in enumerate(lst):
                      votes[num]+=w*(1.0-pos*0.018)
              for num in range(1,29):
                  cnt=sum(1 for lst in [zr,Lr,Rr] if num in lst)
                  if cnt>=2:
                      votes[num]+=cnt*1.8
              s=sorted(votes.items(), key=lambda x: (x[1], -x[0]), reverse=True)
              return [n for n,_ in s[:16]]

          # Historial inmutable 12302-12322
          hist_path=pathlib.Path('history')
          hist_path.mkdir(exist_ok=True)
          for sorteo in range(12302, 12323):
              jf=hist_path / f'{sorteo}.json'
              rows_up=[r for r in rows if r['c'] < sorteo]
              if len(rows_up) < 50:
                  continue
              # No sobreescribir salvo 12321 con fuga
              if jf.exists() and sorteo!=12321:
                  continue
              if jf.exists() and sorteo==12321:
                  try:
                      data=json.loads(jf.read_text())
                      Rr_old=data.get('pools',{}).get('Rr',[])
                      if not (4 in Rr_old and 17 in Rr_old and 21 in Rr_old and 22 in Rr_old and 24 in Rr_old):
                          continue
                  except:
                      pass
              zr=pool2(rows_up)
              Lr=pool3(rows_up)
              Rr=pool4(rows_up)
              Tr=pool_final(zr,Lr,Rr)
              payload={"sorteo": sorteo, "pools": {"Tr": Tr, "zr": zr, "Lr": Lr, "Rr": Rr}}
              jf.write_text(json.dumps(payload, indent=2), encoding='utf-8')

          # Pools para siguiente sorteo
          max_c=rows[-1]['c'] if rows else 12322
          next_c=max_c+1
          rows_up_next=[r for r in rows if r['c'] < next_c]
          zr=pool2(rows_up_next)
          Lr=pool3(rows_up_next)
          Rr=pool4(rows_up_next)
          Tr=pool_final(zr,Lr,Rr)

          # Cargar historial para HIST_POOLS
          hist_pools={}
          for jf in hist_path.glob('*.json'):
              try:
                  data=json.loads(jf.read_text())
                  s=data.get('sorteo')
                  if s: hist_pools[int(s)]=data.get('pools',{})
              except: pass

          # Fechas
          meses=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"]
          def to_label(c,R,fecha):
              try:
                  d=datetime.datetime.strptime(fecha,"%Y-%m-%d")
                  hour='15:00 hrs - De las Tres' if c%2==0 else '21:00 hrs - Chispazo Clásico'
                  return f"{d.day:02d} {meses[d.month-1]} {d.year} - {hour}"
              except:
                  return f"Sorteo {c}"

          # Sorteos ultimos 20
          ultimos=sorted(rows, key=lambda x: x["c"], reverse=True)[:20]
          sorteos_list=[]
          for r in ultimos:
              label=to_label(r["c"], r["R"], r["fecha"]).replace("'","")
              sorteos_list.append(f"{{num:{r['c']},win:[{','.join(map(str,r['R']))}],date:'{label}'}}")
          sorteos_js="const sorteos=[\n"+",\n".join(sorteos_list)+"\n];"

          # Pill
          try:
              base=datetime.datetime.strptime(rows[-1]['fecha'],"%Y-%m-%d")
              hour_label='21:00 hrs - Chispazo Clásico' if max_c%2==1 else '15:00 hrs - De las Tres'
              next_date=base if max_c%2==1 else base+datetime.timedelta(days=1)
              fmt_next=f"{next_date.day} {meses[next_date.month-1]} {next_date.year}"
          except:
              fmt_next=""; hour_label=""
          pill=f"{fmt_next} • {hour_label} • Sorteo {next_c}"

          # Generar index.html COMPLETO desde cero (sin regex patch)
          html=f'''<!DOCTYPE html>
          <html lang="es">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>CHISPAZO PREDICTOR V3</title>
          <style>
          :root{{--yellow:#ffeb3b;--cyan:#00e5ff;--pink:#ff4081;--green:#76ff03;--bg:#0a0a0a;--card:#121212;--card2:#1a1a1a;--border:#2a2a2a}}
          *{{box-sizing:border-box;margin:0;padding:0}}
          body{{background:var(--bg);color:#e8e8e8;padding-bottom:120px;font-family:system-ui,Segoe UI,Roboto,Arial;overflow-x:hidden}}
          .mono{{font-family:ui-monospace,Menlo,Monaco,monospace}}
          .neon-title{{font-size:52px;font-weight:900;text-align:center;color:var(--yellow);text-shadow:0 0 12px rgba(255,235,59,.9),0 0 24px rgba(255,235,59,.5);line-height:.9}}
          .neon-title span{{color:var(--cyan);text-shadow:0 0 12px rgba(0,229,255,.9)}}
          .pill{{border-radius:999px;padding:6px 14px;font-size:11px;font-weight:700;display:inline-flex;align-items:center}}
          .container{{max-width:980px;margin:0 auto;padding:12px}}
          .pool-card{{background:var(--card2);border:1.5px solid;border-radius:12px;padding:10px}}
          .num-grid{{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}}
          .num-cell{{background:var(--card);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:6px 0;text-align:center;font-size:12px;font-weight:800}}
          .wheel-btn{{border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;cursor:pointer;border:1px solid}}
          .table{{width:100%;border-collapse:collapse;font-size:12px}}
          .table th{{border:1px solid var(--border);padding:8px 6px;background:var(--card2);text-align:center;font-size:11px}}
          .table td{{border:1px solid var(--border);padding:0;text-align:center}}
          .hit-cell{{padding:8px 4px;border-radius:6px;margin:2px;font-weight:800;cursor:pointer}}
          .hit-5{{background:#7c4dff;color:white}}.hit-4{{background:#2e7d32;color:#a5d6a7}}.hit-3{{background:#424242;color:#aaa}}.hit-0{{background:#212121;color:#666}}
          .modal-bg{{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px;overflow:hidden}}
          .modal{{width:100%;max-width:580px;height:90vh;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;background:#121212;border:1px solid #333;border-radius:12px}}
          .modal-scroll{{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px;min-height:0}}
          </style>
          </head>
          <body>
          <div style="width:100%;background:#0a0a0a;display:flex;justify-content:center;padding:12px 0;border-bottom:1px solid #1e1e1e">
          <a href="https://chat.whatsapp.com/" target="_blank" style="border:1px solid rgba(37,211,102,.5);background:rgba(37,211,102,.12);color:#25D366;border-radius:999px;padding:6px 14px;font-size:11px;font-weight:700;text-decoration:none">Unidos contra el chispazo - Grupo WhatsApp</a>
          </div>
          <div class="container">
          <div class="neon-title">CHISPAZO PREDICTOR <span>V3</span></div>
          <div style="text-align:center;margin:12px 0"><span class="pill" style="background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);color:var(--cyan)">{pill}</span></div>
          <div style="text-align:center;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><span class="pill mono" style="background:#1e1e1e;border:1px solid #333;color:#aaa;font-size:10px">Basado en Chispazo Predictor v2</span><span class="pill mono" style="background:#1e1e1e;border:1px solid #333;color:#aaa;font-size:10px">Fuente oficial pakin/Chispazo.csv at master</span></div>
          <div style="margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
          <button onclick="downloadCSV()" style="border:1px solid rgba(0,229,255,.4);background:rgba(0,229,255,.15);color:var(--cyan);padding:3px 12px;border-radius:999px;font-size:11px;font-weight:800;cursor:pointer">csv</button>
          <button onclick="downloadTXT()" style="border:1px solid rgba(255,235,59,.4);background:rgba(255,235,59,.1);color:var(--yellow);padding:3px 12px;border-radius:999px;font-size:11px;font-weight:800;cursor:pointer">txt</button>
          <h2 style="font-size:19px;font-weight:900">Sorteo {next_c}</h2>
          </div>
          <div id="pools" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div>
          <div style="margin-top:14px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center">
          <span class="mono" style="font-size:11px">Backtesting 200 sorteos ({next_c-201}-{next_c-1})</span>
          <button onclick="openBacktest()" style="background:rgba(0,229,255,.15);border:1px solid rgba(0,229,255,.4);color:var(--cyan);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;cursor:pointer">Ver Detalle Backtesting</button>
          </div>
          <div style="margin-top:14px">
          <div style="background:var(--yellow);color:black;padding:6px 10px;font-size:11px;font-weight:900;border-radius:6px 6px 0 0">RESULTADOS - Últimos 20 (toca la celda) - Pool Final = P2+P3+P4</div>
          <table class="table"><thead><tr><th style="width:18%">Sorteo</th><th style="width:20.5%;color:var(--yellow)">Pool Final</th><th style="width:20.5%;color:var(--cyan)">Pool2</th><th style="width:20.5%;color:var(--pink)">Pool3</th><th style="width:20.5%;color:var(--green)">Pool4</th></tr></thead><tbody id="results-body"></tbody></table>
          </div>
          </div>
          </div>
          <div id="modal-root"></div><div style="height:80px"></div>
          <script>
          const Tr={Tr};
          const zr={zr};
          const Lr={Lr};
          const Rr={Rr};
          let sorteoNum={next_c};
          window.HIST_POOLS={json.dumps(hist_pools)};
          const pools=[
          {{id:'final',label:'Pool FINAL CONSENSUS 16 números',nums:Tr,count:16,border:'#ffeb3b',accent:'#ffeb3b',desc:'CONSENSUS 16 • Pool final con votos cruzados P2+P3+P4',wheelings:[{{k:14,slice:Tr.slice(0,14)}},{{k:16,slice:Tr}},{{k:18,slice:[...Tr,11,20]}},{{k:21,slice:[...Tr,11,20,2,7,10]}}]}},
          {{id:'p2',label:'Pool2 HOT first (Freq Decay)',nums:zr,count:21,border:'#00e5ff',accent:'#00e5ff',desc:'Pool2 HOT 21 • Frecuencia con decaimiento',wheelings:[{{k:14,slice:zr.slice(0,14)}},{{k:16,slice:zr.slice(0,16)}},{{k:18,slice:zr.slice(0,18)}},{{k:21,slice:zr}}]}},
          {{id:'p3',label:'Pool3 BALANCED (Gap/Overdue)',nums:Lr,count:21,border:'#ff4081',accent:'#ff4081',desc:'Pool3 BALANCED 21 • Gap y overdue',wheelings:[{{k:14,slice:Lr.slice(0,14)}},{{k:16,slice:Lr.slice(0,16)}},{{k:18,slice:Lr.slice(0,18)}},{{k:21,slice:Lr}}]}},
          {{id:'p4',label:'Pool4 BALANCED RECENCY (Recencia x Stickiness)',nums:Rr,count:21,border:'#76ff03',accent:'#76ff03',desc:'Pool4 RECENCY 21 • Recencia x Stickiness',wheelings:[{{k:14,slice:Rr.slice(0,14)}},{{k:16,slice:Rr.slice(0,16)}},{{k:18,slice:Rr.slice(0,18)}},{{k:21,slice:Rr}}]}},
          ];
          function uv(k){{return k===14?12:k===16?24:k===18?36:48}}
          function gf(n,k){{let r=1;for(let i=1;i<=k;i++)r=r*(n-i+1)/i;return Math.round(r)}}
          function rv(e,n,t){{let r=e.filter((c)=>n.includes(c)).sort((c,m)=>c-m),l=e.filter((c)=>!n.includes(c)),u=new Set,i=[];if(r.length>0){{let c=[];for(let y=0;y<Math.min(5,r.length);y++)c.push(r[y]);let m=0;while(c.length<5&&m<l.length){{let y=l[m];if(!c.includes(y))c.push(y);m++}}let g=0;while(c.length<5&&g<e.length){{if(!c.includes(e[g]))c.push(e[g]);g++}}if(c.sort((y,k)=>y-k),c.length===5)u.add(c.join(",")),i.push(c)}}let o=Ef(e,t*2);for(let c of o){{let m=c.join(",");if(!u.has(m)){{if(u.add(m),i.push(c),i.length>=t)break}}}}let a=0;while(i.length<t&&a<e.length){{let c=e.slice(a,a+5);if(c.length===5){{let m=[...c].sort((y,k)=>y-k),g=m.join(",");if(!u.has(g))u.add(g),i.push(m)}}a++}}if(n.length>0)return i.sort((c,m)=>{{let g=c.filter((k)=>n.includes(k)).length,y=m.filter((k)=>n.includes(k)).length;if(y!==g)return y-g;for(let k=0;k<5;k++)if(c[k]!==m[k])return c[k]-m[k];return 0}}),i.slice(0,t);else return[...i].sort((m,g)=>{{for(let y=0;y<5;y++)if(m[y]!==g[y])return m[y]-g[y];return 0}}).slice(0,t)}}
          function Ef(e,n){{let t=e.length,r=new Set,l=[];if(t<7)return[];let u=t-6;for(let i=0;i<n;i++){{let o=0,a=false;while(o<n*4&&!a){{let c=i+o*n,m=c*2%6,g=(c*3+1)%6;if(g===m)g=(g+1)%6;let y=6+c*5%u,k=6+(c*7+2)%u;if(k===y)k=6+(k-6+1)%u;let w=6+(c*11+5)%u,_=0;while((w===y||w===k)&&_<u+5)w=6+(w-6+1)%u,_++;let $=[e[m],e[g],e[y],e[k],e[w]].sort((d,S)=>d-S);if(new Set($).size<5){{o++;continue}}let f=$.join(",");if(!r.has(f)){{r.add(f);l.push($);a=true}}else o++}}if(!a){{let c=0;while(c<100&&!a){{let m=i*13+c*17+3,g=m*2%6,y=(m*3+1)%6;if(y===g)y=(y+2)%6;let k=6+(m*5+c)%u,w=6+(m*7+2+c*2)%u;if(w===k)w=6+(w-6+1)%u;let _=6+(m*11+5+c*3)%u,$=0;while((_===k||_===w)&&$<u+5)_=6+(_-6+1)%u,$++;let h=[e[g],e[y],e[k],e[w],e[_]].sort((d,S)=>d-S),f=h.join(",");if(!r.has(f)&&new Set(h).size===5){{r.add(f);l.push(h);a=true}}c++}}}}return l.sort((i,o)=>{{for(let a=0;a<5;a++)if(i[a]!==o[a])return i[a]-o[a];return 0}}).slice(0,n)}}
          {sorteos_js}
          function hitsCount(a,w){{return a.filter(n=>w.includes(n)).length}}
          function renderPools(){{const c=document.getElementById('pools');c.innerHTML='';pools.forEach(p=>{{let d=document.createElement('div');d.className='pool-card';d.style.borderColor=p.border;d.style.boxShadow=`0 0 14px ${{p.border}}33`;let nH=p.nums.map(n=>`<div class="num-cell" style="border-color:${{p.border}}55;color:${{p.accent}}">${{String(n).padStart(2,'0')}}</div>`).join('');let wH=p.wheelings.map(w=>`<button class="wheel-btn" style="border-color:${{p.border}}88;background:${{p.border}}22;color:${{p.accent}}" onclick="openWheeling('${{p.id}}',${{w.k}})">${{w.k}} si 4</button>`).join('');d.innerHTML=`<div style="display:flex;justify-content:space-between"><span style="font-size:11px;font-weight:800;color:${{p.accent}}">${{p.label}}</span><span class="pill" style="background:${{p.border}}22;border:1px solid ${{p.border}}66;color:${{p.accent}};font-size:10px">${{p.count}} #</span></div><div class="num-grid">${{nH}}</div><div style="margin-top:6px"><span style="font-size:9px;color:var(--yellow)">● WHEELINGS - Sistemas Reducidos</span><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${{wH}}</div><div class="mono" style="font-size:8px;color:#666;margin-top:4px;line-height:1.3">${{p.desc}}</div></div>`;c.appendChild(d);}})}}
          function hitClass(c){{if(c>=5)return 'hit-5';if(c===4)return 'hit-4';if(c===3)return 'hit-3';return 'hit-0'}}
          function renderResults(){{const b=document.getElementById('results-body');b.innerHTML='';const hist=window.HIST_POOLS||{{}};sorteos.forEach(s=>{{let tr=document.createElement('tr');let poolsToUse=hist[s.num]||{{Tr:window.Tr,zr:window.zr,Lr:window.Lr,Rr:window.Rr}};let pf=(poolsToUse.Tr||window.Tr).filter(n=>s.win.includes(n)).length;let p2=(poolsToUse.zr||window.zr).filter(n=>s.win.includes(n)).length;let p3=(poolsToUse.Lr||window.Lr).filter(n=>s.win.includes(n)).length;let p4=(poolsToUse.Rr||window.Rr).filter(n=>s.win.includes(n)).length;tr.innerHTML=`<td style="padding:10px 4px;font-weight:900;font-size:12px">${{s.num}}</td><td><div class="hit-cell ${{hitClass(pf)}}" onclick="openCellPopout(${{s.num}},'final')">${{pf}}/16</div></td><td><div class="hit-cell ${{hitClass(p2)}}" onclick="openCellPopout(${{s.num}},'p2')">${{p2}}/21</div></td><td><div class="hit-cell ${{hitClass(p3)}}" onclick="openCellPopout(${{s.num}},'p3')">${{p3}}/21</div></td><td><div class="hit-cell ${{hitClass(p4)}}" onclick="openCellPopout(${{s.num}},'p4')">${{p4}}/21</div></td>`;b.appendChild(tr);}})}}
          function openWheeling(id,k,sorteoNum){{let slice=null;let p=null;let w=null;if(sorteoNum && window.HIST_POOLS && window.HIST_POOLS[sorteoNum]){{let hist=window.HIST_POOLS[sorteoNum];let histPool=null;if(id.toLowerCase().includes('final') || id==='Pfinal' || id==='final') histPool=hist.Tr;else if(id.toLowerCase().includes('hot') || id==='p2') histPool=hist.zr;else if(id.toLowerCase().includes('recency') || id==='p4') histPool=hist.Rr;else histPool=hist.Lr;if(histPool){{if((id.toLowerCase().includes('final') || id==='Pfinal' || id==='final')){{let baseTr=hist.Tr;if(k===14) slice=baseTr.slice(0,14);else if(k===16) slice=baseTr;else if(k===18) slice=[...baseTr,11,20].filter((v,i,a)=>a.indexOf(v)===i);else slice=[...baseTr,11,20,2,7,10].filter((v,i,a)=>a.indexOf(v)===i);}} else {{if(k===14) slice=histPool.slice(0,14);else if(k===16) slice=histPool.slice(0,16);else if(k===18) slice=histPool.slice(0,18);else slice=histPool.slice(0,21);}}}}if(!slice){{p=pools.find(x=>x.id===id);if(p){{ w=p.wheelings.find(x=>x.k===k); slice=w.slice; }}}}let total=gf(slice.length,5),reduced=uv(k),theoretical=Math.round(total/17);if(k===21&&slice.length===21)theoretical=1197;let combos=Ef(slice,reduced);let win=null,winDate='';if(sorteoNum){{let s=sorteos.find(x=>x.num===sorteoNum);if(s){{win=s.win;winDate=s.date;combos=rv(slice,win,reduced);}}}}else{{combos=combos.sort((a,b)=>{{return 0}});}}let winHtml='';if(win){{winHtml=`<div style="background:${{hitsCount(slice,win)>=5?'#7c4dff':'#2e7d32'}};color:white;border-radius:10px;padding:10px;text-align:center"><div style="font-size:10px;font-weight:900">● GANADORES REALES</div><div style="font-size:20px;font-weight:900;letter-spacing:0.08em;margin:2px 0">${{win.map(n=>String(n).padStart(2,'0')).join(' ')}}</div><div style="font-size:10px;opacity:0.9">${{winDate}} - Sorteo ${{sorteoNum}}</div></div>`;}}let poolBaseHtml=`<div style="margin-top:10px;border:1px solid ${{p?p.border:'#333'}}66;border-radius:10px;padding:8px;background:#1a1a1a"><div style="font-size:10px;font-weight:800;color:${{p?p.accent:'#aaa'}}">POOL BASE (${{slice.length}} nums) - ${{hitsCount(slice,win||[])}} aciertos</div><div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:6px">${{slice.map(n=>{{let isW=win?win.includes(n):false;return `<span style="background:${{isW?'#2e7d32':'#1a1a1a'}};border:1px solid ${{isW?'#4caf50':'#333'}};color:${{isW?'white':(p?p.accent:'#aaa')}};border-radius:5px;padding:2px 5px;font-size:11px;font-weight:800" class="mono">${{String(n).padStart(2,'0')}}</span>`}}).join('')}}</div></div>`;let listHtml=combos.map((c,i)=>{{let h=win?hitsCount(c,win):0;let bg=h===5?'#7c4dff':h===4?'#2e7d32':'#212121';let col=h>=4?'white':'#888';return `<div style="display:flex;gap:4px;align-items:center;margin:4px 0;background:${{i===0&&win?'rgba(124,77,255,0.12)':'transparent'}};border-radius:6px;padding:4px"><span style="font-size:10px;background:#222;border:1px solid #333;border-radius:4px;padding:1px 4px;min-width:18px;text-align:center">${{i+1}}</span><div style="display:flex;gap:2px">${{c.map(n=>`<span style="background:${{win&&win.includes(n)?(h===5?'#7c4dff':'#2e7d32'):'#1a1a1a'}};border:1px solid ${{win&&win.includes(n)?(h===5?'#b388ff':'#4caf50'):'#333'}};color:${{win&&win.includes(n)?'white':'#ccc'}};border-radius:4px;padding:2px 5px;font-size:11px;font-weight:800">${{String(n).padStart(2,'0')}}</span>`).join('')}}</div><span style="margin-left:auto;background:${{bg}};color:${{col}};border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900">${{h}} ac</span></div>`}}).join('');let html=`<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="modal-header" style="padding:10px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;font-weight:900">Sorteo ${{sorteoNum||sorteoNum}} - ${{p?p.label:id}} - ${{k}} si 4</span><button onclick="closeModal()" style="background:#2a2a2a;border:1px solid #555;color:white;border-radius:50%;width:26px;height:26px;cursor:pointer">×</button></div><div class="modal-scroll">${{winHtml}}${{poolBaseHtml}}<div style="margin-top:10px"><div style="font-size:11px;font-weight:800">Combinaciones (${{combos.length}}) - Garantía ${{k}} si 4</div>${{listHtml}}</div></div><div class="modal-footer" style="padding:8px;background:#0f0f0f;border-top:1px solid #222;display:flex;justify-content:space-between"><span class="mono" style="font-size:9px;color:#555">Total posibles ${{total}} - Reducido ${{reduced}} - Teórico 1/${{theoretical}}</span><button onclick="closeModal()" style="background:#222;border:1px solid #444;color:#ccc;border-radius:999px;padding:4px 12px;font-size:10px">CERRAR [Esc]</button></div></div></div>`;document.getElementById('modal-root').innerHTML=html;}}
          function openCellPopout(num,pid){{let s=sorteos.find(x=>x.num===num),p=pools.find(x=>x.id===pid),win=s.win,ph=win.filter(n=>p.nums.includes(n)),isFive=ph.length===5,grid=p.nums.map(n=>`<div class="num-cell" style="background:${{win.includes(n)?(isFive?'#7c4dff':'#2e7d32'):'var(--card)'}};border-color:${{win.includes(n)?(isFive?'#b388ff':'#4caf50'):'#333'}};color:${{win.includes(n)?'white':p.accent}};${{win.includes(n)?'box-shadow:0 0 8px '+(isFive?'#7c4dff':'#2e7d32')+';':''}}">${{String(n).padStart(2,'0')}}</div>`).join(''),wr='';p.wheelings.forEach(w=>{{let combos=rv(w.slice,win,uv(w.k)),sc=combos.map(c=>({{c,h:hitsCount(c,win)}})).sort((a,b)=>b.h-a.h),best=sc[0]?.h||0,top=sc.filter(x=>x.h>=2).slice(0,3),premio=best===5?'PREMIO 5!':best===4?'PREMIO 4!':'',badgeColor=best===5?'#7c4dff':best===4?'#2e7d32':'#424242',bt=top.map((it,idx)=>`<div style="display:flex;gap:4px;align-items:center;margin:4px 0;background:${{idx===0?'rgba(124,77,255,0.12)':'transparent'}};border:${{idx===0?'1px solid #7c4dff44':'0'}};border-radius:6px;padding:3px"><span style="font-size:10px;background:#222;border:1px solid #333;border-radius:4px;padding:1px 4px;min-width:16px;text-align:center">${{idx+1}}</span><div style="display:flex;gap:2px">${{it.c.map(n=>`<span style="background:${{win.includes(n)?(it.h===5?'#7c4dff':'#2e7d32'):'#1a1a1a'}};border:1px solid ${{win.includes(n)?(it.h===5?'#b388ff':'#4caf50'):'#333'}};color:${{win.includes(n)?'white':'#ccc'}};border-radius:4px;padding:2px 4px;font-size:11px;font-weight:800">${{String(n).padStart(2,'0')}}</span>`).join('')}}</div><span style="margin-left:auto;background:${{it.h>=5?'#7c4dff':it.h===4?'#2e7d32':'#424242'}};color:white;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900">${{it.h}} ac</span></div>`).join('')||'<div style="font-size:10px;color:#666;padding:4px">Sin combinaciones con 2+ aciertos</div>';wr+=`<div style="margin-top:12px;border:1px solid ${{best>=4?'#7c4dff66':'#2a2a2a'}};border-radius:10px;padding:8px;background:${{best>=5?'rgba(124,77,255,0.08)':'#1a1a1a'}}"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;font-weight:900;color:${{p.accent}};border:1px solid ${{p.border}}66;background:${{p.border}}22;padding:2px 8px;border-radius:999px">${{w.k}} si 4</span><div style="display:flex;gap:6px;align-items:center"><span style="font-size:10px;font-weight:800;color:${{best>=4?'#a5d6a7':'#888'}}">Mejor ${{best}} aciertos</span>${{premio?`<span style="background:${{badgeColor}};color:white;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:900">${{premio}}</span>`:''}}<span style="font-size:9px;color:#666">${{top.length}} comb + ${{uv(w.k)-top.length}} total</span></div></div><div style="font-size:10px;color:#aaa;margin:4px 0">${{w.k}} si 4: Mejor ${{best}} aciertos (${{top.length?top.length+' combinación':'0'}})</div>${{bt}}<div style="text-align:center;margin-top:8px"><button onclick="openWheeling('${{p.id}}',${{w.k}},${{s.num}})" style="background:#222;border:1px solid #333;color:#aaa;border-radius:999px;padding:4px 12px;font-size:10px;cursor:pointer">Ver Wheeling Completo ${{w.k}} si 4 ↗</button></div></div>`}});let html=`<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div class="modal-header" style="padding:10px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;font-weight:900">Sorteo ${{s.num}} - ${{p.label}}</span><button onclick="closeModal()" style="background:#2a2a2a;border:1px solid #555;color:white;border-radius:50%;width:26px;height:26px;cursor:pointer">×</button></div><div class="modal-scroll"><div style="background:${{ph.length===5?'#7c4dff':'var(--yellow)'}};color:${{ph.length===5?'white':'black'}};border-radius:10px;padding:10px;text-align:center"><div style="font-size:10px;font-weight:900">● GANADORES REALES</div><div style="font-size:20px;font-weight:900;letter-spacing:0.08em;margin:2px 0">${{win.map(n=>String(n).padStart(2,'0')).join(' ')}}</div><div style="font-size:10px;opacity:0.9">${{s.date}}</div></div><div style="margin-top:12px;border:1px solid ${{p.border}}66;border-radius:10px;padding:10px;background:#1a1a1a"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;font-weight:900;color:${{p.accent}}">POOL ${{p.id==='final'?'FINAL':p.id.toUpperCase()}} (${{p.count}} nums) - ${{ph.length}} aciertos</span><span class="pill" style="background:${{ph.length===5?'#7c4dff':ph.length===4?'#2e7d32':'#333'}};color:white;border:0;font-size:11px;font-weight:900;padding:4px 10px">${{ph.length}}/${{p.count}}</span></div><div class="num-grid" style="margin-top:8px">${{grid}}</div><div class="mono" style="font-size:9px;color:#888;margin-top:6px">Acertados: ${{ph.map(n=>String(n).padStart(2,'0')).join(', ')}} - ${{ph.length}} de 5</div></div><div style="margin-top:12px"><div style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:${{p.accent}};display:inline-block"></span><span style="font-size:11px;font-weight:900;color:${{p.accent}}">WHEELINGS - RESULTADOS EN ESTE SORTEO</span></div>${{wr}}</div></div><div class="modal-footer" style="padding:8px;background:#0f0f0f;border-top:1px solid #222;display:flex;justify-content:space-between"><span class="mono" style="font-size:9px;color:#555">Sorteo ${{s.num}} - Pool ${{p.id}} ${{p.count}}</span><button onclick="closeModal()" style="background:#222;border:1px solid #444;color:#ccc;border-radius:999px;padding:4px 12px;font-size:10px">CERRAR [Esc]</button></div></div></div>`;document.getElementById('modal-root').innerHTML=html;}}
          function closeModal(){{document.getElementById('modal-root').innerHTML=''}}
          function openBacktest(){{document.getElementById('modal-root').innerHTML=`<div class="modal-bg" onclick="closeModal()"><div class="modal" style="height:auto;max-height:80vh"><div class="modal-header" style="padding:12px;display:flex;justify-content:space-between"><b style="font-size:12px;color:var(--cyan)">Backtesting 200 sorteos ({next_c-201}-{next_c-1})</b><button onclick="closeModal()" style="background:#2a2a2a;border:1px solid #444;color:white;border-radius:999px;padding:2px 8px">X</button></div><div class="modal-scroll"><div class="mono" style="font-size:10px;color:#aaa">Pool FINAL 16 ~92% 3+ ~48% 4+<br/>Pool2 21 ~96% 3+ 56.5% 4+<br/>Pool3 21 ~97% 3+ 63.5% 4+<br/>Pool4 21 ~96% 3+ 61% 4+</div></div></div></div>`;}}
          function downloadTXT(){{try{{let lines=[];lines.push('CHISPAZO PREDICTOR V3 '+sorteoNum);pools.forEach(function(p){{p.wheelings.forEach(function(w){{let combos=Ef(w.slice,uv(w.k));lines.push('POOL:'+p.id+' K:'+w.k+' BASE:'+w.slice.join(',')+' TOTAL:'+combos.length);combos.forEach(function(c,i){{lines.push((i+1)+':'+c.map(function(n){{return String(n).padStart(2,'0')}}).join('-'));}});lines.push('');}});}});let txt=lines.join(String.fromCharCode(10));let blob=new Blob([txt],{{type:'text/plain;charset=utf-8'}});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=sorteoNum+'.txt';document.body.appendChild(a);a.click();setTimeout(function(){{document.body.removeChild(a);URL.revokeObjectURL(url)}},1200);}}catch(e){{alert('Error txt: '+e.message)}}}}
          function downloadCSV(){{try{{let rows=[];rows.push('sorteo,pool,pool_label,wheeling_k,base_numeros,combo_num,n1,n2,n3,n4,n5,total_posibles,reducido');pools.forEach(function(p){{p.wheelings.forEach(function(w){{let combos=Ef(w.slice,uv(w.k));let total=gf(w.slice.length,5);let reducido=uv(w.k);combos.forEach(function(c,i){{rows.push([sorteoNum,p.id,'"'+p.label+'"',w.k,'"'+w.slice.join(' ')+'"',i+1,c[0],c[1],c[2],c[3],c[4],total,reducido].join(','));}});}});}});let csv=rows.join(String.fromCharCode(10));let blob=new Blob([csv],{{type:'text/csv;charset=utf-8;'}});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=sorteoNum+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){{document.body.removeChild(a);URL.revokeObjectURL(url)}},1200);}}catch(e){{alert('Error csv: '+e.message)}}}}
          renderPools();renderResults();
          </script>
          <!-- AUTO UPDATE: ultimo={max_c} fecha={rows[-1]['fecha'] if rows else ''} siguiente={next_c} {fmt_next} {hour_label} pools=v9_completo_sin_regex generado={datetime.datetime.utcnow().isoformat()}Z -->
