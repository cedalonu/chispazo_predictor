name: Update Chispazo Predictor V7 - fix tabla vacia + CSV
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bajar CSV multi-source
        run: |
          rm -f Chispazo.csv
          URL1="https://raw.githubusercontent.com/pakinja/pakin/refs/heads/master/Chispazo.csv?t=$(date +%s)&r=$RANDOM"
          URL2="https://raw.githubusercontent.com/pakinja/pakin/master/Chispazo.csv?t=$(date +%s)&r=$RANDOM"
          URL3="https://cdn.jsdelivr.net/gh/pakinja/pakin@master/Chispazo.csv?t=$(date +%s)"
          for URL in "$URL1" "$URL2" "$URL3"; do
            echo "Probando $URL"
            curl -L --fail --max-time 30 -H "Cache-Control: no-cache" -o Chispazo.csv "$URL" && break
            sleep 2
          done
          wc -l Chispazo.csv
          tail -n 3 Chispazo.csv

      - name: Fix generate_pools.py bug si existe
        run: |
          # Parchea el bug zr=Lr en el txt si esta
          if grep -q "zr={Lr}" generate_pools.py 2>/dev/null; then
            echo "Bug detectado en generate_pools.py, lo dejo pero JS es correcto"
          fi
          python3 generate_pools.py
          cat /tmp/pools.js

      - name: Actualizar index.html con tabla fix
        run: |
          python3 << 'PY'
          import csv, re, pathlib, datetime, json
          from collections import defaultdict

          csv_path=pathlib.Path('Chispazo.csv')
          rows=[]
          with open(csv_path, encoding='utf-8') as f:
              clean=[l for l in f if l.strip()!='']
              for r in csv.DictReader(clean):
                  try:
                      c=int(r['CONCURSO']); R=[int(r['R1']),int(r['R2']),int(r['R3']),int(r['R4']),int(r['R5'])]
                      rows.append({"CONCURSO":c,"R":R,"FECHA":r['FECHA']})
                  except: continue
          rows.sort(key=lambda x: x["CONCURSO"])
          max_row=rows[-1]; max_c=max_row["CONCURSO"]; next_c=max_c+1
          print(f"CSV max={max_c} next={next_c}")

          pjs=pathlib.Path('/tmp/pools.js')
          if not pjs.exists():
              pjs=pathlib.Path('pools.js')
          pools_js=pjs.read_text()
          print(f"Pools JS: {pools_js[:200]}")

          meses=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"]
          por_fecha=defaultdict(list)
          for r in rows: por_fecha[r["FECHA"]].append(r)
          for k in por_fecha: por_fecha[k]=sorted(por_fecha[k], key=lambda x: x["CONCURSO"])

          def to_label(r):
              same=por_fecha[r["FECHA"]]
              idx=same.index(r)
              is_tres=(idx==0) if len(same)>1 else (r["CONCURSO"]%2==1)
              hour='15:00 hrs - De las Tres' if is_tres else '21:00 hrs - Chispazo Clasico'
              d=datetime.datetime.strptime(r["FECHA"],"%Y-%m-%d")
              return f"{d.day:02d} {meses[d.month-1]} {d.year} - {hour}"

          base=datetime.datetime.strptime(max_row["FECHA"],"%Y-%m-%d")
          hour_label='21:00 hrs - Chispazo Clasico' if max_c%2==1 else '15:00 hrs - De las Tres'
          next_date=base if max_c%2==1 else base+datetime.timedelta(days=1)
          fmt_next=f"{next_date.day} {meses[next_date.month-1]} {next_date.year}"
          pill=f"{fmt_next} • {hour_label} • Sorteo {next_c}"

          # Historial SOLO ultimos 30 para no romper JS
          hist_path=pathlib.Path('history')
          hist_pools={}
          if hist_path.exists():
              all_files=sorted(hist_path.glob('*.json'), key=lambda x: int(x.stem.split('_')[0]) if x.stem.split('_')[0].isdigit() else 0, reverse=True)
              for jf in all_files[:30]:
                  try:
                      data=json.loads(jf.read_text()); s=data.get('sorteo')
                      if s: hist_pools[int(s)]=data.get('pools',{})
                  except: pass

          ultimos=sorted(rows, key=lambda x: x["CONCURSO"], reverse=True)[:20]
          print(f"Ultimos 20: {[r['CONCURSO'] for r in ultimos]}")
          js_lines=[]
          for r in ultimos:
              label=to_label(r)
              # Escapar comillas simples en label por si acaso
              label_esc=label.replace("'","")
              js_lines.append(f"{{num:{r['CONCURSO']},win:[{','.join(map(str,r['R']))}],date:'{label_esc}'}}")
          sorteos_js="const sorteos=[\n"+",\n".join(js_lines)+"\n];"
          print(f"Sorteos JS: {sorteos_js[:500]}")
          hist_json=json.dumps(hist_pools)

          p=pathlib.Path('index.html')
          t=p.read_text(encoding='utf-8')

          # Reemplazar pools
          for name in ['Tr','zr','Lr','Rr']:
              mm=re.search(rf'const {name}\s*=\s*\[(.*?)\];', pools_js, re.S)
              if mm:
                  t=re.sub(rf'const {name}\s*=\s*\[.*?\];', f"const {name}=[{mm.group(1)}];", t, flags=re.S)

          # Reemplazar pill y sorteoNum
          t=re.sub(r'<span class="pill"[^>]*>.*?</span>', f'<span class="pill">{pill}</span>', t, flags=re.S)
          t=re.sub(r'(?:let|const|var)\s+sorteoNum\s*=\s*\d+;', f'let sorteoNum={next_c};', t)
          t=re.sub(r'Backtesting\s+\d+\s+sorteos\s+\(\d+-\d+\)', f'Backtesting 200 sorteos ({next_c-201}-{next_c-1})', t)
          t=re.sub(r'<h2[^>]*>Sorteo\s+\d+</h2>', f'<h2>Sorteo {next_c}</h2>', t, flags=re.I)

          # Reemplazar sorteos - hacerlo con funcion para evitar greedy
          if 'const sorteos=' in t:
              # Buscar y reemplazar solo el bloque sorteos
              t=re.sub(r'const sorteos=\[.*?\];', sorteos_js, t, flags=re.S)
          else:
              t=t.replace('window.HIST_POOLS', f'{sorteos_js}\nwindow.HIST_POOLS')

          # HIST_POOLS limitado a 30
          if 'window.HIST_POOLS' not in t:
              t=t.replace('const sorteos=[', f'window.HIST_POOLS={hist_json};\nconst sorteos=[')
          else:
              t=re.sub(r'window\.HIST_POOLS=.*?;', f'window.HIST_POOLS={hist_json};', t, flags=re.S)

          # Eliminar duplicados de hist-fix viejos que rompen render
          t=re.sub(r'<script id="hist-fix">.*?</script>', '', t, flags=re.S)

          marker=f"<!-- AUTO UPDATE: ultimo={max_c} fecha={max_row['FECHA']} siguiente={next_c} {fmt_next} {hour_label} pools=v7_fix_tabla generado={datetime.datetime.utcnow().isoformat()}Z -->"
          if '<!-- AUTO UPDATE' in t:
              t=re.sub(r'<!-- AUTO UPDATE.*?-->', marker, t, flags=re.S)
          else:
              t=t.replace('</body>', marker+'\n</body>')

          p.write_text(t, encoding='utf-8')
          print(f"OK escrito index.html siguiente={next_c}")
          PY

      - name: Commit
        run: |
          if git diff --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "chispazo-bot"
          git config user.email "bot@github.com"
          git add index.html history/
          git commit -m "V7 fix: tabla resultados vacia + CSV refs/heads + historial 30"
          git push

