name: Update Chispazo Predictor V6 auto
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bajar CSV
        run: |
          curl -L -H "Cache-Control: no-cache" -o Chispazo.csv "https://raw.githubusercontent.com/pakinja/pakin/master/Chispazo.csv?t=$(date +%s)"
          wc -l Chispazo.csv
      - name: Generar Pools
        run: |
          python3 generate_pools.py
          cat /tmp/pools.js
      - name: Actualizar index
        run: |
          python3 << 'PY'
          import re, pathlib, datetime, json
          from collections import defaultdict
          import csv as csvm
          rows=[]
          with open('Chispazo.csv', encoding='utf-8') as f:
            clean=[l for l in f if l.strip()!='']
            for r in csvm.DictReader(clean):
              try:
                c=int(r['CONCURSO']); R=[int(r['R1']),int(r['R2']),int(r['R3']),int(r['R4']),int(r['R5'])]
                rows.append({"CONCURSO":c,"R":R,"FECHA":r['FECHA']})
              except: continue
          rows.sort(key=lambda x: x["CONCURSO"])
          max_row=rows[-1]; max_c=max_row["CONCURSO"]; next_c=max_c+1
          pools_js=pathlib.Path('/tmp/pools.js').read_text()
          p=pathlib.Path('index.html')
          t=p.read_text(encoding='utf-8')
          for name in ['Tr','zr','Lr','Rr']:
            mm=re.search(rf'const {name}\s*=\s*\[(.*?)\];', pools_js, re.S)
            if mm:
              t=re.sub(rf'const {name}\s*=\s*\[.*?\];', f"const {name}=[{mm.group(1)}];", t, flags=re.S)
          t=re.sub(r'sorteoNum\s*=\s*\d+;', f'let sorteoNum={next_c};', t)
          p.write_text(t, encoding='utf-8')
          print(f"OK siguiente={next_c}")
          PY
      - name: Commit
        run: |
          if git diff --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "chispazo-bot"
          git config user.email "bot@github.com"
          git add index.html history/
          git commit -m "Auto V6 auto"
          git push

