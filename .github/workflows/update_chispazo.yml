
name: Update Chispazo Predictor

on:
  schedule:
    - cron: '30 22 * * *' # 16:30 CDMX = 22:30 UTC (De las Tres +1.5h)
    - cron: '30 4 * * *'  # 22:30 CDMX = 04:30 UTC dia siguiente (Clasico +1.5h)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo predictor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pakin repo para CSV
        uses: actions/checkout@v4
        with:
          repository: pakinja/pakin
          path: pakin
          sparse-checkout: Chispazo.csv

      - name: Actualizar index.html con ultimo sorteo
        run: |
          python3 - << 'PY'
          import csv, re, pathlib, datetime
          csv_path = pathlib.Path('pakin/Chispazo.csv')
          if not csv_path.exists():
              # fallback raw fetch
              import urllib.request
              urllib.request.urlretrieve('https://raw.githubusercontent.com/pakinja/pakin/master/Chispazo.csv', csv_path)
          max_concurso=0
          max_fecha=''
          with open(csv_path, newline='', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              for row in reader:
                  try:
                      c=int(row['CONCURSO'])
                  except:
                      continue
                  if c>max_concurso:
                      max_concurso=c
                      max_fecha=row.get('FECHA','')
          next_concurso=max_concurso+1
          print(f"Ultimo: {max_concurso} {max_fecha} -> Siguiente: {next_concurso}")

          # Determinar siguiente fecha
          try:
              base=datetime.datetime.strptime(max_fecha.strip(), '%Y-%m-%d')
          except:
              base=datetime.datetime.now()
          if max_concurso%2==0: # ultimo fue Clasico 21:00 -> siguiente De las Tres dia siguiente
              next_date=base+datetime.timedelta(days=1)
              hour='15:00 hrs — Chispazo De las Tres'
              short='De las Tres'
          else:
              next_date=base
              hour='21:00 hrs — Chispazo Clásico'
              short='Clásico'

          meses=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"]
          fmt=f"{next_date.day} {meses[next_date.month-1]} {next_date.year}"

          index_path=pathlib.Path('index.html')
          if not index_path.exists():
              # buscar en subcarpetas
              for p in pathlib.Path('.').rglob('index.html'):
                  if 'chispazo' in str(p).lower() or p.parent.name=='.':
                      index_path=p
                      break

          text=index_path.read_text(encoding='utf-8', errors='ignore')

          # Reemplazar Sorteo 12319 por Sorteo next en titulo visible (no romper React minificado)
          # Busca patrones Sorteo 12319
          text=re.sub(r'Sorteo\s+12319', f'Sorteo {next_concurso}', text)
          text=re.sub(r'sorteo-12319', f'sorteo-{next_concurso}', text, flags=re.I)
          text=re.sub(r'18 Oct 2026', fmt, text) # actualiza fecha ejemplo
          # Guardar metadata como comentario para debug
          marker=f"<!-- AUTO UPDATE: ultimo={max_concurso} fecha={max_fecha} siguiente={next_concurso} {fmt} {hour} generado={datetime.datetime.utcnow().isoformat()}Z -->"
          if "<!-- AUTO UPDATE" in text:
              text=re.sub(r'<!-- AUTO UPDATE.*?-->', marker, text, flags=re.S)
          else:
              text=text.replace('</body>', marker+'\n</body>')

          index_path.write_text(text, encoding='utf-8')
          # Guardar datos para commit message
          pathlib.Path('/tmp/next.txt').write_text(f"{max_concurso} {max_fecha} {next_concurso} {fmt} {short}")
          PY

      - name: Commit y push si hay cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          NEXT=$(cat /tmp/next.txt)
          git config user.name "chispazo-bot"
          git config user.email "bot@cedalonu.github.io"
          git add index.html
          git commit -m "Auto: ultimo $NEXT"
          git push
