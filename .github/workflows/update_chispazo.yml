name: Update Chispazo Predictor

on:
  schedule:
    - cron: '30 22 * * *'
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bajar CSV oficial
        run: |
          curl -L -o Chispazo.csv https://raw.githubusercontent.com/pakinja/pakin/master/Chispazo.csv
          echo "Lineas:" && wc -l Chispazo.csv && head -n 3 Chispazo.csv

      - name: Actualizar index.html
        run: |
          python3 - << 'PY'
          import csv, re, pathlib, datetime
          csv_path = pathlib.Path('Chispazo.csv')
          max_c=0; max_f=''
          with open(csv_path, encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  try:
                      c=int(row['CONCURSO'])
                      if c>max_c:
                          max_c=c; max_f=row.get('FECHA','').strip()
                  except: continue
          next_c=max_c+1
          print(f"Ultimo {max_c} {max_f} -> Siguiente {next_c}")
          try: base=datetime.datetime.strptime(max_f, '%Y-%m-%d')
          except: base=datetime.datetime.now()
          # Chispazo: De las Tres 15:00 y Clasico 21:00, se alternan
          if max_c % 2 == 1:
              next_date=base; hour='21:00 hrs — Chispazo Clásico'; short='Clásico'
          else:
              next_date=base+datetime.timedelta(days=1); hour='15:00 hrs — Chispazo De las Tres'; short='De las Tres'
          meses=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"]
          fmt=f"{next_date.day} {meses[next_date.month-1]} {next_date.year}"
          p=pathlib.Path('index.html')
          t=p.read_text(encoding='utf-8')
          # GENERICO, no 12319 fijo
          t=re.sub(r'Sorteo\s+\d{4,5}', f'Sorteo {next_c}', t)
          t=re.sub(r'sorteo-\d{4,5}', f'sorteo-{next_c}', t, flags=re.I)
          t=re.sub(r'\d{1,2}\s+(Ene|Feb|Mar|Abr|May|Jun|Jul|Ago|Sep|Oct|Nov|Dic)\s+\d{4}', fmt, t)
          t=re.sub(r'(let|var|const)\s+sorteoNum\s*=\s*\d+', rf'\1 sorteoNum = {next_c}', t)
          t=re.sub(r'\(\d+-\d+\)', f'({max_c-199}-{max_c})', t)
          marker=f"<!-- AUTO UPDATE: ultimo={max_c} fecha={max_f} siguiente={next_c} {fmt} {hour} generado={datetime.datetime.utcnow().isoformat()}Z -->"
          if "<!-- AUTO UPDATE" in t: t=re.sub(r'<!-- AUTO UPDATE.*?-->', marker, t, flags=re.S)
          else: t=t.replace('</body>', marker+'\n</body>')
          p.write_text(t, encoding='utf-8')
          pathlib.Path('/tmp/next.txt').write_text(f"{max_c} {max_f} {next_c} {fmt} {short}")
          PY

      - name: Commit y push
        run: |
          git diff --quiet && echo "Sin cambios" && exit 0
          git config user.name "chispazo-bot"
          git config user.email "bot@github.com"
          git add index.html
          git commit -m "Auto: $(cat /tmp/next.txt)"
          git push
