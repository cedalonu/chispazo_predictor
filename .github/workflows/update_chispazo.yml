name: Update Chispazo Predictor V8 - final sin cortes ni balones
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bajar CSV multi-source
        run: |
          rm -f Chispazo.csv
          URL1="https://raw.githubusercontent.com/pakinja/pakin/refs/heads/master/Chispazo.csv?t=$(date +%s)&r=$RANDOM"
          URL2="https://raw.githubusercontent.com/pakinja/pakin/master/Chispazo.csv?t=$(date +%s)&r=$RANDOM"
          URL3="https://cdn.jsdelivr.net/gh/pakinja/pakin@master/Chispazo.csv?t=$(date +%s)"
          for URL in "$URL1" "$URL2" "$URL3"; do
            echo "Probando $URL"
            curl -L --fail --max-time 30 -H "Cache-Control: no-cache" -o Chispazo.csv "$URL" && break
            sleep 2
          done
          wc -l Chispazo.csv
          tail -n 3 Chispazo.csv

      - name: Regenerar historial 20 sorteos corregido inmutable
        run: |
          python3 << 'PY'
          import pathlib, json
          from collections import defaultdict, Counter
          import csv as csvm
          csv_path=pathlib.Path('Chispazo.csv')
          rows=[]
          with open(csv_path, encoding='utf-8') as f:
              clean=[l for l in f if l.strip()!='']
              for r in csvm.DictReader(clean):
                  try:
                      c=int(r['CONCURSO']); R=[int(r['R1']),int(r['R2']),int(r['R3']),int(r['R4']),int(r['R5'])]
                      rows.append({"c":c,"R":R,"fecha":r['FECHA']})
                  except: continue
          rows.sort(key=lambda x: x["c"])
          def pool2(rows_up, decay=0.985):
              scores=defaultdict(float)
              for i, row in enumerate(reversed(rows_up[-200:])):
                  w=decay**i
                  for n in row["R"]:
                      scores[n]+=w
              s=sorted(scores.items(), key=lambda x: (x[1], -x[0]), reverse=True)
              return [n for n,_ in s[:21]]
          def pool3(rows_up):
              last_seen={}
              for row in rows_up:
                  for n in row["R"]:
                      last_seen[n]=row["c"]
              max_c_local=rows_up[-1]["c"] if rows_up else 0
              gaps=[(n, max_c_local-last_seen.get(n, max_c_local-100)) for n in range(1,29)]
              gaps.sort(key=lambda x: (x[1], -x[0]), reverse=True)
              Lr=[n for n,_ in gaps[:14]]
              zr=pool2(rows_up, decay=0.985)
              for n in zr:
                  if n not in Lr and len(Lr)<21:
                      Lr.append(n)
              return Lr
          def pool4(rows_up, stick_window=40):
              last=rows_up[-stick_window:]
              cnt=Counter()
              for r in last:
                  cnt.update(r["R"])
              last_seen={}
              for row in rows_up:
                  for n in row["R"]:
                      last_seen[n]=row["c"]
              max_c_local=rows_up[-1]["c"] if rows_up else 0
              scores=[]
              for n in range(1,29):
                  gap=max_c_local-last_seen.get(n,0)
                  rec=1/(1+gap*0.25)
                  score=rec*1.5 + cnt.get(n,0)*0.35 + (1/(1+gap))*0.6
                  scores.append((n,score))
              scores.sort(key=lambda x: (x[1], -x[0]), reverse=True)
              return [n for n,_ in scores[:21]]
          def pool_final(zr,Lr,Rr, weights=(3,1,2)):
              votes=defaultdict(float)
              for idx,lst in enumerate([zr,Lr,Rr]):
                  w=weights[idx]
                  for pos,num in enumerate(lst):
                      votes[num]+=w*(1.0-pos*0.018)
              for num in range(1,29):
                  cnt=sum(1 for lst in [zr,Lr,Rr] if num in lst)
                  if cnt>=2:
                      votes[num]+=cnt*1.8
              s=sorted(votes.items(), key=lambda x: (x[1], -x[0]), reverse=True)
              return [n for n,_ in s[:16]]
          hist_path=pathlib.Path('history')
          hist_path.mkdir(exist_ok=True)
          for sorteo in range(12302, 12323):
              jf=hist_path / f'{sorteo}.json'
              rows_up=[r for r in rows if r['c'] < sorteo]
              if len(rows_up) < 50:
                  continue
              if jf.exists() and sorteo!=12321:
                  continue
              if jf.exists() and sorteo==12321:
                  try:
                      data=json.loads(jf.read_text())
                      Rr_old=data.get('pools',{}).get('Rr',[])
                      if not (4 in Rr_old and 17 in Rr_old and 21 in Rr_old and 22 in Rr_old and 24 in Rr_old):
                          continue
                      print(f"12321 tiene fuga 5/21 falso, regenerando")
                  except:
                      pass
              zr=pool2(rows_up)
              Lr=pool3(rows_up)
              Rr=pool4(rows_up)
              Tr=pool_final(zr,Lr,Rr)
              payload={"sorteo": sorteo, "pools": {"Tr": Tr, "zr": zr, "Lr": Lr, "Rr": Rr}}
              jf.write_text(json.dumps(payload, indent=2), encoding='utf-8')
              print(f"Generado {sorteo}: Rr contiene 04? {4 in Rr}")
          PY

      - name: Guardar prediccion anterior en historial
        run: |
          python3 << 'PY'
          import re, json, pathlib
          p=pathlib.Path('index.html')
          t=p.read_text(encoding='utf-8')
          m=re.search(r'let sorteoNum=(\d+);', t)
          if not m:
              exit(0)
          sorteo=int(m.group(1))
          def get_pool(name):
              mm=re.search(rf'const {name}=\[(.*?)\];', t, re.S)
              return [int(x) for x in mm.group(1).split(',') if x.strip().isdigit()] if mm else []
          Tr=get_pool('Tr'); zr=get_pool('zr'); Lr=get_pool('Lr'); Rr=get_pool('Rr')
          hist=pathlib.Path('history'); hist.mkdir(exist_ok=True)
          f=hist / f'{sorteo}.json'
          if f.exists():
              print(f"Ya existe {sorteo}")
              exit(0)
          if not Tr:
              exit(0)
          payload={"sorteo": sorteo, "pools": {"Tr": Tr, "zr": zr, "Lr": Lr, "Rr": Rr}}
          f.write_text(json.dumps(payload, indent=2), encoding='utf-8')
          print(f"Guardado {f}")
          PY

      - name: Generar Pools V4
        run: |
          python3 generate_pools.py
          cat /tmp/pools.js

      - name: Actualizar index.html V8 sin balones ni cortes
        run: |
          python3 << 'PY'
          import re, pathlib, datetime, json
          from collections import defaultdict
          import csv as csvm
          csv_path=pathlib.Path('Chispazo.csv')
          rows=[]
          with open(csv_path, encoding='utf-8') as f:
              clean=[l for l in f if l.strip()!='']
              for r in csvm.DictReader(clean):
                  try:
                      c=int(r['CONCURSO']); R=[int(r['R1']),int(r['R2']),int(r['R3']),int(r['R4']),int(r['R5'])]
                      rows.append({"CONCURSO":c,"R":R,"FECHA":r['FECHA']})
                  except: continue
          rows.sort(key=lambda x: x["CONCURSO"])
          max_row=rows[-1]; max_c=max_row["CONCURSO"]; next_c=max_c+1
          pools_js=pathlib.Path('/tmp/pools.js').read_text()
          meses=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"]
          por_fecha=defaultdict(list)
          for r in rows: por_fecha[r["FECHA"]].append(r)
          for k in por_fecha: por_fecha[k]=sorted(por_fecha[k], key=lambda x: x["CONCURSO"])
          def to_label(r):
              same=por_fecha[r["FECHA"]]
              idx=same.index(r)
              is_tres = (idx==0) if len(same)>1 else (r["CONCURSO"]%2==1)
              hour='15:00 hrs - De las Tres' if is_tres else '21:00 hrs - Chispazo Clásico'
              d=datetime.datetime.strptime(r["FECHA"],"%Y-%m-%d")
              return f"{d.day:02d} {meses[d.month-1]} {d.year} - {hour}"
          base=datetime.datetime.strptime(max_row["FECHA"],"%Y-%m-%d")
          hour_label='21:00 hrs - Chispazo Clásico' if max_c%2==1 else '15:00 hrs - De las Tres'
          next_date=base if max_c%2==1 else base+datetime.timedelta(days=1)
          fmt_next=f"{next_date.day} {meses[next_date.month-1]} {next_date.year}"
          pill=f"{fmt_next} • {hour_label} • Sorteo {next_c}"
          hist_path=pathlib.Path('history')
          hist_pools={}
          if hist_path.exists():
              for jf in hist_path.glob('*.json'):
                  try:
                      data=json.loads(jf.read_text())
                      s=data.get('sorteo')
                      if s: hist_pools[int(s)]=data.get('pools',{})
                  except: pass
          if len(hist_pools)>30:
              keys_sorted=sorted(hist_pools.keys(), reverse=True)[:30]
              hist_pools={k:hist_pools[k] for k in keys_sorted}
          ultimos=sorted(rows, key=lambda x: x["CONCURSO"], reverse=True)[:20]
          js_lines=[]
          for r in ultimos:
              label=to_label(r).replace("'","")
              js_lines.append(f"{{num:{r['CONCURSO']},win:[{','.join(map(str,r['R']))}],date:'{label}'}}")
          sorteos_js="const sorteos=[\n"+",\n".join(js_lines)+"\n];"
          hist_json=json.dumps(hist_pools)
          p=pathlib.Path('index.html')
          t=p.read_text(encoding='utf-8')
          for name in ['Tr','zr','Lr','Rr']:
              mm=re.search(rf'const {name}\s*=\s*\[(.*?)\];', pools_js, re.S)
              if mm:
                  t=re.sub(rf'const {name}\s*=\s*\[.*?\];', f"const {name}=[{mm.group(1)}];", t, flags=re.S)
          t=re.sub(r'<span class="pill"[^>]*>.*?</span>', f'<span class="pill" style="background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);color:var(--cyan)">{pill}</span>', t, count=1, flags=re.S)
          t=re.sub(r'(?:let|const|var)\s+sorteoNum\s*=\s*\d+;', f'let sorteoNum={next_c};', t)
          t=re.sub(r'<h2[^>]*>Sorteo\s+\d+</h2>', f'<h2 style="font-size:19px;font-weight:900">Sorteo {next_c}</h2>', t, flags=re.I)
          t=re.sub(r'Backtesting\s+\d+\s+sorteos\s+\(\d+-\d+\)', f'Backtesting 200 sorteos ({next_c-201}-{next_c-1})', t)
          t=re.sub(r'const sorteos=\[.*?\];', sorteos_js, t, flags=re.S)
          if 'window.HIST_POOLS' not in t:
              t=t.replace('const sorteos=[', f'window.HIST_POOLS={hist_json};\nconst sorteos=[')
          else:
              t=re.sub(r'window\.HIST_POOLS=.*?;', f'window.HIST_POOLS={hist_json};', t, flags=re.S)
          t=re.sub(r'<script id="hist-fix">.*?</script>', '', t, flags=re.S)
          marker=f"<!-- AUTO UPDATE: ultimo={max_c} fecha={max_row['FECHA']} siguiente={next_c} {fmt_next} {hour_label} pools=v8_final_sin_balon_sin_corte generado={datetime.datetime.utcnow().isoformat()}Z -->"
          if '<!-- AUTO UPDATE' in t:
              t=re.sub(r'<!-- AUTO UPDATE.*?-->', marker, t, flags=re.S)
          else:
              t=t.replace('</body>', marker+'\n</body>')
          p.write_text(t, encoding='utf-8')
          print(f"OK {next_c} historial {len(hist_pools)}")
          PY

      - name: Commit
        run: |
          if git diff --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "chispazo-bot"
          git config user.email "bot@github.com"
          git add index.html history/
          git commit -m "V8 final: sin balones rojos, sin corte, tabla no vacia, 12321=4/21 real inmutable"
          # Fix para Error: failed to push some refs ... fetch first
          git pull --rebase origin main || (git fetch origin main && git rebase origin/main)
          git push || git push origin main
          echo "Push OK"

