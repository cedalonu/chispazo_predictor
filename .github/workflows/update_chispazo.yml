name: Update Chispazo Predictor
on:
  schedule:
    - cron: '30 22 * * *'
    - cron: '30 4 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bajar CSV
        run: curl -L -o Chispazo.csv https://raw.githubusercontent.com/pakinja/pakin/master/Chispazo.csv
      - name: Actualizar index
        run: |
          python3 << 'PY'
          import csv, re, pathlib, datetime
          csv_path=pathlib.Path('Chispazo.csv')
          max_c=0; max_f=''
          with open(csv_path, newline='', encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  try:
                      c=int(row['CONCURSO'])
                      if c>max_c:
                          max_c=c; max_f=row.get('FECHA','').strip()
                  except: 
                      continue
          next_c=max_c+1
          try:
              base=datetime.datetime.strptime(max_f,'%Y-%m-%d')
          except:
              base=datetime.datetime.now()
          if max_c%2==1:
              next_date=base
              hour='21:00 hrs - Chispazo Clasico'
          else:
              next_date=base+datetime.timedelta(days=1)
              hour='15:00 hrs - De las Tres'
          meses=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"]
          fmt=f"{next_date.day} {meses[next_date.month-1]} {next_date.year}"
          p=pathlib.Path('index.html')
          t=p.read_text(encoding='utf-8')
          t=re.sub(r'Sorteo\s+\d{4,5}', f'Sorteo {next_c}', t)
          t=re.sub(r'\d{1,2}\s+(Ene|Feb|Mar|Abr|May|Jun|Jul|Ago|Sep|Oct|Nov|Dic)\s+\d{4}', fmt, t)
          marker=f"<!-- AUTO UPDATE: ultimo={max_c} fecha={max_f} siguiente={next_c} {fmt} {hour} -->"
          if "<!-- AUTO UPDATE" in t:
              t=re.sub(r'<!-- AUTO UPDATE.*?-->', marker, t, flags=re.S)
          else:
              t=t.replace('</body>', marker+'\n</body>')
          p.write_text(t, encoding='utf-8')
          pathlib.Path('/tmp/next.txt').write_text(f"{max_c} {max_f} {next_c}")
          print(f"OK ultimo={max_c} siguiente={next_c}")
          PY
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "chispazo-bot"
          git config user.email "bot@github.com"
          git add index.html
          git commit -m "Auto: $(cat /tmp/next.txt)"
          git push
