name: Backfill V2 - rotacion forzada 4 siempre
on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bajar CSV
        run: |
          curl -L --max-time 30 -o Chispazo.csv "https://raw.githubusercontent.com/pakinja/pakin/master/Chispazo.csv"
          wc -l Chispazo.csv
      - name: Backfill con rotacion forzada 4
        run: |
          python3 << 'PY'
          import csv, pathlib, json
          from collections import defaultdict, Counter

          ROWS=[]
          with open('Chispazo.csv', encoding='utf-8') as f:
              clean=[l for l in f if l.strip()!='']
              for r in csv.DictReader(clean):
                  try:
                      c=int(r['CONCURSO']); R=[int(r['R1']),int(r['R2']),int(r['R3']),int(r['R4']),int(r['R5'])]
                      ROWS.append({"c":c,"R":R})
                  except: continue
          ROWS.sort(key=lambda x: x["c"])

          def pools_for(rows_up, next_c):
              def p2():
                  scores=defaultdict(float)
                  for i,row in enumerate(reversed(rows_up[-200:])):
                      scores[row["R"][0]]+=0.985**i
                      for n in row["R"]:
                          scores[n]+=0.985**i*0.2
                  for n in range(1,29):
                      scores[n]+=((next_c*37 + n*13)%100)/1000.0
                  return [n for n,_ in sorted(scores.items(), key=lambda x: x[1], reverse=True)[:21]]
              def p3():
                  last={}
                  for r in rows_up:
                      for n in r["R"]:
                          last[n]=r["c"]
                  gaps=[(n, rows_up[-1]["c"]-last.get(n,0) + ((next_c*17+n*23)%7)) for n in range(1,29)]
                  gaps.sort(key=lambda x: x[1], reverse=True)
                  Lr=[n for n,_ in gaps[:14]]
                  zr=p2()
                  for n in zr:
                      if n not in Lr and len(Lr)<21:
                          Lr.append(n)
                  rot=next_c%5
                  return Lr[rot:]+Lr[:rot], zr
              def p4():
                  cnt=Counter()
                  for r in rows_up[-40:]:
                      cnt.update(r["R"])
                  last={}
                  for r in rows_up:
                      for n in r["R"]:
                          last[n]=r["c"]
                  scores=[]
                  for n in range(1,29):
                      gap=rows_up[-1]["c"]-last.get(n,0)
                      rec=1/(1+gap*0.25)
                      jit=((next_c*29+n*11)%100)/200.0
                      scores.append((n, rec*1.5 + cnt.get(n,0)*0.35 + 1/(1+gap)*0.6 + jit))
                  scores.sort(key=lambda x: x[1], reverse=True)
                  return [n for n,_ in scores[:21]]

              Lr,zr = p3()
              Rr = p4()
              votes=defaultdict(float)
              for idx,lst in enumerate([zr,Lr,Rr]):
                  w=(3,1,2)[idx]
                  for pos,num in enumerate(lst):
                      votes[num]+=w*(1-pos*0.02)
              for num in range(1,29):
                  if sum(1 for lst in [zr,Lr,Rr] if num in lst)>=2:
                      votes[num]+=2
              sv=sorted(votes.items(), key=lambda x: x[1], reverse=True)
              cand=[n for n,_ in sv[:28]]  # 28 candidatos, no 24
              # Rotacion determinista fuerte por next_c
              shift = (next_c * 7) % 12
              cand = cand[shift:] + cand[:shift]
              Tr = cand[:12]  # 12 fijos
              # 4 nuevos de cola
              remaining = [n for n in cand[12:] if n not in Tr][:4]
              # Si no hay 4, completar con resto del ranking
              idx=28
              while len(remaining)<4 and idx < len(sv):
                  n=sv[idx][0]
                  if n not in Tr and n not in remaining:
                      remaining.append(n)
                  idx+=1
              Tr = Tr + remaining[:4]
              # Forzar 4 distintos vs anterior siempre
              return Tr[:16], zr, Lr, Rr, sv

          hist=pathlib.Path('history')
          hist.mkdir(exist_ok=True)
          # Borrar historial viejo igual para regenerar
          for f in hist.glob('*.json'):
              f.unlink()
          start = max(0, len(ROWS)-200)
          for i in range(start, len(ROWS)):
              rows_up=ROWS[:i]
              if len(rows_up)<40:
                  continue
              next_c=ROWS[i]["c"]
              Tr,zr,Lr,Rr,sv = pools_for(rows_up, next_c)
              # Forzar rotacion vs prev siempre
              prev_f=hist/f"{next_c-1}.json"
              if prev_f.exists():
                  try:
                      prev=json.loads(prev_f.read_text())
                      prevTr=prev['pools']['Tr']
                      overlap=len(set(Tr)&set(prevTr))
                      if overlap>12 or True:  # siempre forzar 4
                          # reemplazar ultimos 4 por 4 no usados de sv
                          remaining=[]
                          for n,_ in sv:
                              if n not in Tr[:12] and n not in remaining:
                                  remaining.append(n)
                              if len(remaining)>=8:
                                  break
                          # tomar 4 que no esten en prev o que den mayor diversidad
                          new_tail=[]
                          for n in remaining:
                              if n not in prevTr or len(new_tail)>=2:
                                  new_tail.append(n)
                              if len(new_tail)>=4:
                                  break
                          if len(new_tail)<4:
                              new_tail=remaining[:4]
                          Tr = Tr[:12] + new_tail[:4]
                  except Exception as e:
                      print(f"err {e}")
              payload={"sorteo": next_c, "pools": {"Tr": Tr, "zr": zr, "Lr": Lr, "Rr": Rr}}
              (hist/f"{next_c}.json").write_text(json.dumps(payload, indent=2))
              print(f"{next_c}: {Tr} overlap prev {len(set(Tr)&set(json.loads(prev_f.read_text())['pools']['Tr'])) if prev_f.exists() else 'N/A'}")

          print(f"Backfill V2 completo {len(list(hist.glob('*.json')))} archivos")
          PY
      - name: Commit backfill V2
        run: |
          git config user.name "chispazo-bot"
          git config user.email "bot@github.com"
          git add history/
          git commit -m "Backfill V2: rotacion forzada 4 siempre - fix pools iguales"
          git push

