name: Update Chispazo Data & Rebuild

on:
  schedule:
    # Sorteo 3:00 PM CDMX -> Resultados ~4:30 PM CDMX -> 22:30 UTC
    - cron: '30 22 * * *'
    # Sorteo 9:00 PM CDMX -> Resultados ~10:30 PM CDMX -> 04:30 UTC
    - cron: '30 4 * * *'
  # Permite ejecutarlo manualmente desde la pestaña "Actions" en GitHub
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch Latest Chispazo CSV
        run: |
          # Descarga el CSV más reciente desde la fuente oficial
          curl -o data.csv "https://raw.githubusercontent.com/pakinja/pakin/refs/heads/master/Chispazo.csv"
          echo "CSV descargado exitosamente."

      - name: Check for Changes and Commit
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git add data.csv
          if git diff --staged --quiet; then
            echo "No hay nuevos sorteos aún. Esperando próxima actualización."
          else
            git commit -m "chore: Actualización automática de datos Chispazo (Sorteo nuevo detectado)"
            git push
            echo "Datos actualizados y push realizado."
          fi
