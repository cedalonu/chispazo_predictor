name: Update Chispazo Data & Rebuild

on:
  schedule:
    # Sorteo 3:00 PM CDMX -> ~22:30 UTC
    - cron: '30 22 * * *'
    # Sorteo 9:00 PM CDMX -> ~04:30 UTC
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Fetch Latest Chispazo CSV
        run: |
          curl -o data.csv "https://raw.githubusercontent.com/pakinja/pakin/refs/heads/master/Chispazo.csv"
          echo "CSV descargado exitosamente."

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Actualización automática de datos Chispazo"
          file_pattern: data.csv
