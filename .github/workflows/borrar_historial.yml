name: Borra historial falso
on:
  workflow_dispatch:
jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Borrar history/
        run: |
          rm -rf history/
          ls -la
      - name: Commit borrado
        run: |
          git config user.name "chispazo-bot"
          git config user.email "bot@github.com"
          git add -A
          git commit -m "Borra historial sintético falso" || echo "nada que borrar"
          git push
