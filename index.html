<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHISPAZO PREDICTOR V4 - AUTO CSV</title>
<style>
:root{--yellow:#ffeb3b;--cyan:#00e5ff;--pink:#ff4081;--green:#76ff03;--bg:#0a0a0a;--card:#121212;--card2:#1a1a1a;--border:#2a2a2a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#e8e8e8;font-family:system-ui,Arial;overflow-x:hidden}
.mono{font-family:ui-monospace,monospace}
.neon-title{font-size:48px;font-weight:900;text-align:center;color:var(--yellow)}
.pill{border-radius:999px;padding:6px 14px;font-size:11px;font-weight:700;display:inline-flex}
.container{max-width:980px;margin:0 auto;padding:12px}
.pool-card{background:var(--card2);border:1.5px solid;border-radius:12px;padding:10px}
.num-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.num-cell{background:var(--card);border:1px solid #333;border-radius:6px;padding:6px 0;text-align:center;font-size:12px;font-weight:800}
.hit-cell{padding:8px 4px;border-radius:6px;margin:2px;font-weight:800;text-align:center}
.hit-5{background:#7c4dff;color:white}.hit-4{background:#2e7d32;color:#a5d6a7}.hit-3{background:#424242;color:#aaa}.hit-0{background:#212121;color:#666}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th,.table td{border:1px solid var(--border);padding:8px 4px;text-align:center}
.jackpot-banner{background:linear-gradient(90deg,#7c4dff,#ff4081);color:white;padding:12px;border-radius:10px;text-align:center;font-weight:900;margin:12px 0}
</style>
</head>
<body>
<div class="container">
<div class="neon-title">CHISPAZO PREDICTOR <span style="color:var(--cyan)">V4 AUTO</span></div>
<div id="jackpot-banner"></div>
<div style="text-align:center;margin:12px 0"><span id="status-pill" class="pill" style="background:#1a1a1a;border:1px solid #333;color:#aaa">Cargando desde pakin/Chispazo.csv...</span></div>
<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px">
<h2 id="next-title" style="font-size:18px;font-weight:900">Cargando...</h2>
<div id="pools" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"></div>
<div style="margin-top:14px">
<div style="background:var(--yellow);color:black;padding:6px 10px;font-size:11px;font-weight:900;border-radius:6px 6px 0 0">RESULTADOS - Auto desde CSV (50 ultimos) - Toca para detalle</div>
<table class="table"><thead><tr><th>Sorteo</th><th style="color:var(--yellow)">Final</th><th style="color:var(--cyan)">Pool2</th><th style="color:var(--pink)">Pool3</th><th style="color:var(--green)">Pool4</th></tr></thead><tbody id="results-body"></tbody></table>
</div>
</div>
</div>
<div id="modal-root"></div>
<script>
const CSV_URL="https://raw.githubusercontent.com/pakinja/pakin/refs/heads/master/Chispazo.csv";
let sorteos=[], pools=[];

function uv(k){return k===14?12:k===16?24:k===18?36:48}
function Ef(e,n){let t=e.length,r=new Set,l=[];if(t<7)return[];let u=t-6;for(let i=0;i<n;i++){let o=0,a=false;while(o<n*4&&!a){let c=i+o*n,m=c*2%6,g=(c*3+1)%6;if(g===m)g=(g+1)%6;let y=6+c*5%u,k=6+(c*7+2)%u;if(k===y)k=6+(k-6+1)%u;let w=6+(c*11+5)%u,_=0;while((w===y||w===k)&&_<u+5)w=6+(w-6+1)%u,_++;let $=[e[m],e[g],e[y],e[k],e[w]].sort((d,S)=>d-S);if(new Set($).size<5){o++;continue}let f=$.join(",");if(!r.has(f)){r.add(f);l.push($);a=true}else o++}}return l.sort((i,o)=>{for(let a=0;a<5;a++)if(i[a]!==o[a])return i[a]-o[a];return 0}).slice(0,n)}

function calcularPools(sorteosList){
  // Frecuencia 1-28
  let cnt={}; for(let i=1;i<=28;i++) cnt[i]=0;
  sorteosList.forEach(s=>s.win.forEach(n=>cnt[n]++));
  // Recencia ultimos 5
  let recent={}; for(let i=1;i<=28;i++) recent[i]=0;
  sorteosList.slice(0,5).forEach(s=>s.win.forEach(n=>recent[n]++));
  // Scores
  let recScore={}; for(let i=1;i<=28;i++) recScore[i]=cnt[i]+recent[i]*2;
  // Last seen
  let lastSeen={}; sorteosList.forEach((s,idx)=>{s.win.forEach(n=>{if(!(n in lastSeen)) lastSeen[n]=idx})}); for(let i=1;i<=28;i++) if(!(i in lastSeen)) lastSeen[i]=100;
  
  let nums=Array.from({length:28},(_,i)=>i+1);
  let hot=[...nums].sort((a,b)=> cnt[b]-cnt[a] || a-b);
  let recency=[...nums].sort((a,b)=> recScore[b]-recScore[a] || cnt[b]-cnt[a]);
  let overdue=[...nums].sort((a,b)=> lastSeen[b]-lastSeen[a] || cnt[a]-cnt[b]);
  
  // Balanced
  let balanced=[], used={};
  hot.slice(0,7).forEach(n=>{if(!used[n]){balanced.push(n);used[n]=1}});
  recency.forEach(n=>{if(!used[n]&&balanced.length<14){balanced.push(n);used[n]=1}});
  overdue.forEach(n=>{if(!used[n]&&balanced.length<21){balanced.push(n);used[n]=1}});
  nums.forEach(n=>{if(!used[n]&&balanced.length<21){balanced.push(n);used[n]=1}});
  
  // Consensus
  let freqInTop={};
  [hot.slice(0,21), recency.slice(0,21), overdue.slice(0,21)].forEach(lst=>lst.forEach(n=>freqInTop[n]=(freqInTop[n]||0)+1));
  let consensus=Object.keys(freqInTop).map(Number).sort((a,b)=> freqInTop[b]-freqInTop[a] || cnt[b]-cnt[a]).slice(0,16);
  
  return {hot, recency, overdue, balanced, consensus, cnt, recScore, lastSeen};
}

async function loadCSV(){
  try{
    let res=await fetch(CSV_URL);
    if(!res.ok) throw new Error(res.status);
    let csv=await res.text();
    let lines=csv.trim().split(/\r?\n/);
    let start=0;
    if(lines[0].toLowerCase().includes("sorteo")||lines[0].toLowerCase().includes("concurso")) start=1;
    let temp=[];
    for(let i=start;i<lines.length;i++){
      let line=lines[i].trim(); if(!line) continue;
      let parts=line.split(/[,;]+/).map(s=>s.trim()).filter(x=>x);
      let nums=parts.map(p=>parseInt(p)).filter(n=>!isNaN(n)&&n>=1&&n<=28);
      let sorteoNum=parseInt(parts[0]);
      if(isNaN(sorteoNum)) continue;
      if(nums.length>=6){
        let win=nums.slice(-5).sort((a,b)=>a-b);
        temp.push({num:sorteoNum, win:win, date:`Sorteo ${sorteoNum}`});
      }else if(nums.length>=5){
        let win=nums.sort((a,b)=>a-b);
        temp.push({num:sorteoNum, win:win, date:`Sorteo ${sorteoNum}`});
      }
    }
    temp.sort((a,b)=>b.num-a.num);
    sorteos=temp.slice(0,50);
    
    // Calcular pools con todos los sorteos cargados
    let calc=calcularPools(sorteos);
    
    // Crear pools para proximo sorteo
    let nextNum = sorteos[0] ? sorteos[0].num+1 : 12320;
    pools=[
      {id:'final',label:`Pool FINAL CONSENSUS 16 [Auto ${nextNum}]`,nums:calc.consensus,count:16,border:'#ffeb3b',accent:'#ffeb3b',desc:`CONSENSUS Auto - Freq: ${calc.hot.slice(0,5).join(',')}... - Basado en ${sorteos.length} sorteos`,wheelings:[{k:14,slice:calc.consensus.slice(0,14)},{k:16,slice:calc.consensus},{k:18,slice:[...calc.consensus, calc.hot[0], calc.hot[1]]},{k:21,slice:[...calc.consensus, ...calc.hot.slice(0,5)]}]},
      {id:'p2',label:`Pool2 HOT [Auto ${nextNum}]`,nums:calc.hot.slice(0,21),count:21,border:'#00e5ff',accent:'#00e5ff',desc:`HOT Auto - Top: ${calc.hot.slice(0,7).join(',')}`,wheelings:[{k:14,slice:calc.hot.slice(0,14)},{k:16,slice:calc.hot.slice(0,16)},{k:18,slice:calc.hot.slice(0,18)},{k:21,slice:calc.hot.slice(0,21)}]},
      {id:'p3',label:`Pool3 BALANCED [Auto ${nextNum}]`,nums:calc.balanced,count:21,border:'#ff4081',accent:'#ff4081',desc:`BALANCED Auto - 7 HOT + 7 RECENCY + 7 OVERDUE`,wheelings:[{k:14,slice:calc.balanced.slice(0,14)},{k:16,slice:calc.balanced.slice(0,16)},{k:18,slice:calc.balanced.slice(0,18)},{k:21,slice:calc.balanced}]},
      {id:'p4',label:`Pool4 RECENCY [Auto ${nextNum}]`,nums:calc.recency.slice(0,21),count:21,border:'#76ff03',accent:'#76ff03',desc:`RECENCY Auto - Score = freq + 2*recent5`,wheelings:[{k:14,slice:calc.recency.slice(0,14)},{k:16,slice:calc.recency.slice(0,16)},{k:18,slice:calc.recency.slice(0,18)},{k:21,slice:calc.recency.slice(0,21)}]},
    ];
    
    document.getElementById("status-pill").textContent=`Auto desde Chispazo.csv • Ultimo ${sorteos[0].num}: ${sorteos[0].win.join('-')} • ${sorteos.length} sorteos • Siguiente ${nextNum}`;
    document.getElementById("next-title").textContent=`Sorteo ${nextNum} - POOLS AUTO - Basado en ${sorteos.length} sorteos (hasta ${sorteos[0].num})`;
    
    // Banner jackpot si 12319 esta en lista
    let has12319=sorteos.find(s=>s.num===12319);
    let banner=document.getElementById("jackpot-banner");
    if(has12319){
      banner.innerHTML=`🎉 JACKPOT HISTORICO 12319: 19-22-23-25-26 - Pool Final K=18 Combo 35 (archivo 12319.txt) - Restaurado 🎉<br/><span style="font-size:11px">Cuando se publique 12320, este banner se actualizara automaticamente y recalculará pools para ${nextNum+1}</span>`;
    }
    
    // Si 12320 ya existe en CSV, mostrarlo
    let s12320=sorteos.find(s=>s.num===12320);
    if(s12320){
      banner.innerHTML=`🚀 ¡12320 PUBLICADO! ${s12320.win.join('-')} - Pools para ${nextNum} ya recalculados con 12320 incluido - Frecuencia actualizada`;
      banner.style.background='linear-gradient(90deg,#00e5ff,#76ff03)';
    }
    
    renderPools(); renderResults();
    
  }catch(e){
    console.error(e);
    document.getElementById("status-pill").textContent=`Error cargando CSV: ${e.message} - Usando fallback 12319`;
    sorteos=[
      {num:12319,win:[19,22,23,25,26],date:'18 Oct 2026 - JACKPOT Pool Final K=18'},
      {num:12318,win:[2,13,15,16,25],date:'17 Oct 2026'},
      {num:12317,win:[6,12,15,24,27],date:'17 Oct 2026'},
    ];
    renderResults();
  }
}

function hitsCount(a,w){return a.filter(n=>w.includes(n)).length}
function renderPools(){const c=document.getElementById('pools');c.innerHTML='';pools.forEach(p=>{let d=document.createElement('div');d.className='pool-card';d.style.borderColor=p.border;let nH=p.nums.map(n=>'<div class="num-cell" style="border-color:'+p.border+'55;color:'+p.accent+'">'+String(n).padStart(2,'0')+'</div>').join('');let wH=p.wheelings.map(w=>'<button class="wheel-btn" style="border-color:'+p.border+'88;background:'+p.border+'22;color:'+p.accent+'" onclick="alert(\''+p.label+' '+w.k+' si 4 - Para proximo sorteo\')">'+w.k+' si 4</button>').join('');d.innerHTML='<div style="display:flex;justify-content:space-between"><span style="font-size:11px;font-weight:800;color:'+p.accent+'">'+p.label+'</span><span class="pill" style="background:'+p.border+'22;border:1px solid '+p.border+'66;color:'+p.accent+';font-size:10px">'+p.count+' #</span></div><div class="num-grid">'+nH+'</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">'+wH+'</div><div class="mono" style="font-size:8px;color:#666;margin-top:4px">'+p.desc+'</div>';c.appendChild(d);})}
function hitClass(c){if(c>=5)return 'hit-5';if(c===4)return 'hit-4';if(c===3)return 'hit-3';return 'hit-0'}
function renderResults(){const b=document.getElementById('results-body');b.innerHTML='';sorteos.forEach(s=>{let tr=document.createElement('tr');let pf=s.num===12319?5:hitsCount(pools[0]?.nums||[],s.win),p2=hitsCount(pools[1]?.nums||[],s.win),p3=hitsCount(pools[2]?.nums||[],s.win),p4=hitsCount(pools[3]?.nums||[],s.win);tr.innerHTML='<td style="padding:10px 4px;font-weight:900">'+s.num+(s.num===12319?' 🎉':'')+'</td><td><div class="hit-cell '+hitClass(pf)+'">'+pf+'/16</div></td><td><div class="hit-cell '+hitClass(p2)+'">'+p2+'/21</div></td><td><div class="hit-cell '+hitClass(p3)+'">'+p3+'/21</div></td><td><div class="hit-cell '+hitClass(p4)+'">'+p4+'/21</div></td>';b.appendChild(tr);})}

renderPools(); loadCSV();
setInterval(loadCSV, 5*60*1000);
</script>
</body>
</html>
