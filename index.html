<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHISPAZO PREDICTOR V3.1 - POOLS NUEVOS 12320</title>
<style>
:root{--yellow:#ffeb3b;--cyan:#00e5ff;--pink:#ff4081;--green:#76ff03;--bg:#0a0a0a;--card:#121212;--card2:#1a1a1a;--border:#2a2a2a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#e8e8e8;font-family:system-ui,Segoe UI,Roboto,Arial;overflow-x:hidden}
.mono{font-family:ui-monospace,Menlo,Monaco,monospace}
.neon-title{font-size:52px;font-weight:900;text-align:center;color:var(--yellow);text-shadow:0 0 12px rgba(255,235,59,.9)}
.neon-title span{color:var(--cyan)}
.pill{border-radius:999px;padding:6px 14px;font-size:11px;font-weight:700;display:inline-flex;align-items:center}
.container{max-width:980px;margin:0 auto;padding:12px}
.pool-card{background:var(--card2);border:1.5px solid;border-radius:12px;padding:10px}
.num-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.num-cell{background:var(--card);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:6px 0;text-align:center;font-size:12px;font-weight:800}
.wheel-btn{border-radius:999px;padding:4px 10px;font-size:11px;font-weight:800;cursor:pointer;border:1px solid}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th{border:1px solid var(--border);padding:8px 6px;background:var(--card2);text-align:center}
.table td{border:1px solid var(--border);padding:0;text-align:center}
.hit-cell{padding:8px 4px;border-radius:6px;margin:2px;font-weight:800;cursor:pointer}
.hit-5{background:#7c4dff;color:white}.hit-4{background:#2e7d32;color:#a5d6a7}.hit-3{background:#424242;color:#aaa}.hit-0{background:#212121;color:#666}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal{width:100%;max-width:580px;height:90vh;background:#121212;border:1px solid #333;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.modal-scroll{flex:1;overflow-y:auto;padding:12px}
</style>
</head>
<body>
<div class="container">
<div class="neon-title">CHISPAZO PREDICTOR <span>V3.1 NUEVO</span></div>
<div style="text-align:center;margin:12px 0"><span id="status-pill" class="pill" style="background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);color:var(--cyan)">Sorteo 12320 - 18 Oct 2026 21:00 hrs - POOLS ACTUALIZADOS CON 12319 (19-22-23-25-26)</span></div>
<div style="margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px">
<h2 id="next-title" style="font-size:19px;font-weight:900">Sorteo 12320 - POOLS NUEVOS - Basado en 21 sorteos (12299-12319)</h2>
<div id="pools" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"></div>
<div style="margin-top:14px">
<div style="background:var(--yellow);color:black;padding:6px 10px;font-size:11px;font-weight:900;border-radius:6px 6px 0 0">RESULTADOS - Ultimos 21 (incluye 12319) - Frecuencia actualizada</div>
<table class="table"><thead><tr><th>Sorteo</th><th style="color:var(--yellow)">Pool Final</th><th style="color:var(--cyan)">Pool2</th><th style="color:var(--pink)">Pool3</th><th style="color:var(--green)">Pool4</th></tr></thead><tbody id="results-body"></tbody></table>
</div>
</div>
</div>
<div id="modal-root"></div>
<script>
const Tr=[8,6,7,20,3,4,10,11,13,24,27,12,18,2,15,23];
const zr=[2,8,6,7,15,20,23,25,3,4,10,11,13,19,24,26,27,1,9,12,18];
const Lr=[2,8,6,7,15,20,23,25,4,27,24,19,26,13,14,5,3,1,10,9,11];
const Rr=[2,15,23,25,8,4,27,6,24,19,26,13,20,7,18,21,22,12,10,11,3];
const pools=[
{id:'final',label:'Pool FINAL CONSENSUS 16 [NUEVO 12320]',nums:Tr,count:16,border:'#ffeb3b',accent:'#ffeb3b',desc:'CONSENSUS 16 NUEVO - Con 12319 (19,22,23,25,26) - Frecuencia: 2:6,8:6,6:5,7:5,15:5,20:5,23:5,25:5',wheelings:[{k:14,slice:Tr.slice(0,14)},{k:16,slice:Tr},{k:18,slice:[...Tr,2,15]},{k:21,slice:[...Tr,2,15,19,25,26]}]},
{id:'p2',label:'Pool2 HOT first [NUEVO]',nums:zr,count:21,border:'#00e5ff',accent:'#00e5ff',desc:'HOT - Top frecuencia 21 sorteos: 2(6),8(6),6(5),7(5),15(5),20(5),23(5),25(5)',wheelings:[{k:14,slice:zr.slice(0,14)},{k:16,slice:zr.slice(0,16)},{k:18,slice:zr.slice(0,18)},{k:21,slice:zr}]},
{id:'p3',label:'Pool3 BALANCED [NUEVO]',nums:Lr,count:21,border:'#ff4081',accent:'#ff4081',desc:'BALANCED: 7 HOT + 7 RECENCY + 7 OVERDUE',wheelings:[{k:14,slice:Lr.slice(0,14)},{k:16,slice:Lr.slice(0,16)},{k:18,slice:Lr.slice(0,18)},{k:21,slice:Lr}]},
{id:'p4',label:'Pool4 RECENCY [NUEVO]',nums:Rr,count:21,border:'#76ff03',accent:'#76ff03',desc:'RECENCY: freq + 2*recent5 - Top: 2(10),15(9),23(9),25(9)',wheelings:[{k:14,slice:Rr.slice(0,14)},{k:16,slice:Rr.slice(0,16)},{k:18,slice:Rr.slice(0,18)},{k:21,slice:Rr}]},
];
function uv(k){return k===14?12:k===16?24:k===18?36:48}
function gf(n,k){let r=1;for(let i=1;i<=k;i++)r=r*(n-i+1)/i;return Math.round(r)}
function Ef(e,n){let t=e.length,r=new Set,l=[];if(t<7)return[];let u=t-6;for(let i=0;i<n;i++){let o=0,a=false;while(o<n*4&&!a){let c=i+o*n,m=c*2%6,g=(c*3+1)%6;if(g===m)g=(g+1)%6;let y=6+c*5%u,k=6+(c*7+2)%u;if(k===y)k=6+(k-6+1)%u;let w=6+(c*11+5)%u,_=0;while((w===y||w===k)&&_<u+5)w=6+(w-6+1)%u,_++;let $=[e[m],e[g],e[y],e[k],e[w]].sort((d,S)=>d-S);if(new Set($).size<5){o++;continue}let f=$.join(",");if(!r.has(f)){r.add(f);l.push($);a=true}else o++}}return l.sort((i,o)=>{for(let a=0;a<5;a++)if(i[a]!==o[a])return i[a]-o[a];return 0}).slice(0,n)}
function rv(e,n,t){let r=e.filter((c)=>n.includes(c)).sort((c,m)=>c-m),l=e.filter((c)=>!n.includes(c)),u=new Set,i=[];if(r.length>0){let c=[];for(let y=0;y<Math.min(5,r.length);y++)c.push(r[y]);let m=0;while(c.length<5&&m<l.length){let y=l[m];if(!c.includes(y))c.push(y);m++}if(c.sort((y,k)=>y-k),c.length===5)u.add(c.join(",")),i.push(c)}let o=Ef(e,t*2);for(let c of o){let m=c.join(",");if(!u.has(m)){if(u.add(m),i.push(c),i.length>=t)break}}return i.slice(0,t)}
let sorteos=[
{num:12319,win:[19,22,23,25,26],date:'18 Oct 2026 - 15:00 hrs - De las Tres'},
{num:12318,win:[2,13,15,16,25],date:'17 Oct 2026 - 21:00 hrs - Chispazo Clasico'},
{num:12317,win:[6,12,15,24,27],date:'17 Oct 2026 - 15:00 hrs - De las Tres'},
{num:12316,win:[4,8,17,21,23],date:'16 Oct 2026 - 21:00 hrs - Chispazo Clasico'},
{num:12315,win:[2,4,18,27,28],date:'16 Oct 2026 - 15:00 hrs - De las Tres'},
{num:12314,win:[11,17,21,26,27],date:'15 Oct 2026 - 21:00 hrs - Chispazo Clasico'},
{num:12313,win:[2,7,9,11,22],date:'15 Oct 2026 - 15:00 hrs - De las Tres'},
{num:12312,win:[8,13,18,20,23],date:'14 Oct 2026 - 21:00 hrs - Chispazo Clasico'},
{num:12311,win:[1,7,10,11,28],date:'14 Oct 2026 - 15:00 hrs - De las Tres'},
{num:12310,win:[4,7,8,13,20],date:'13 Oct 2026 - 21:00 hrs - Chispazo Clasico'},
{num:12309,win:[3,7,16,23,24],date:'13 Oct 2026 - 15:00 hrs - De las Tres'},
{num:12308,win:[5,7,13,19,26],date:'12 Oct 2026 - 21:00 hrs - Chispazo Clasico'},
{num:12307,win:[8,9,10,15,23],date:'12 Oct 2026 - 15:00 hrs - De las Tres'},
{num:12306,win:[1,11,15,20,27],date:'11 Oct 2026 - 21:00 hrs - Chispazo Clasico'},
{num:12305,win:[2,3,5,18,25],date:'11 Oct 2026 - 15:00 hrs - De las Tres'},
{num:12304,win:[2,6,12,20,24],date:'10 Oct 2026 - 21:00 hrs - Chispazo Clasico'},
{num:12303,win:[4,8,15,21,25],date:'10 Oct 2026 - 15:00 hrs - De las Tres'},
{num:12302,win:[3,6,9,10,24],date:'09 Oct 2026 - 21:00 hrs - Chispazo Clasico'},
{num:12301,win:[2,6,12,25,26],date:'09 Oct 2026 - 15:00 hrs - De las Tres'},
{num:12300,win:[1,8,14,19,22],date:'08 Oct 2026 - 21:00 hrs - Chispazo Clasico'},
{num:12299,win:[3,6,10,19,20],date:'08 Oct 2026 - 15:00 hrs - De las Tres'},
];
function hitsCount(a,w){return a.filter(n=>w.includes(n)).length}
function renderPools(){const c=document.getElementById('pools');c.innerHTML='';pools.forEach(p=>{let d=document.createElement('div');d.className='pool-card';d.style.borderColor=p.border;let nH=p.nums.map(n=>'<div class="num-cell" style="border-color:'+p.border+'55;color:'+p.accent+'">'+String(n).padStart(2,'0')+'</div>').join('');let wH=p.wheelings.map(w=>'<button class="wheel-btn" style="border-color:'+p.border+'88;background:'+p.border+'22;color:'+p.accent+'" onclick="openWheeling(\''+p.id+'\','+w.k+')">'+w.k+' si 4</button>').join('');d.innerHTML='<div style="display:flex;justify-content:space-between"><span style="font-size:11px;font-weight:800;color:'+p.accent+'">'+p.label+'</span><span class="pill" style="background:'+p.border+'22;border:1px solid '+p.border+'66;color:'+p.accent+';font-size:10px">'+p.count+' #</span></div><div class="num-grid">'+nH+'</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">'+wH+'</div><div class="mono" style="font-size:8px;color:#666;margin-top:4px">'+p.desc+'</div>';c.appendChild(d);})}
function hitClass(c){if(c>=5)return 'hit-5';if(c===4)return 'hit-4';if(c===3)return 'hit-3';return 'hit-0'}
function renderResults(){const b=document.getElementById('results-body');b.innerHTML='';sorteos.forEach(s=>{let tr=document.createElement('tr');let pf=hitsCount(pools[0].nums,s.win),p2=hitsCount(pools[1].nums,s.win),p3=hitsCount(pools[2].nums,s.win),p4=hitsCount(pools[3].nums,s.win);tr.innerHTML='<td style="padding:10px 4px;font-weight:900">'+s.num+'</td><td><div class="hit-cell '+hitClass(pf)+'">'+pf+'/16</div></td><td><div class="hit-cell '+hitClass(p2)+'">'+p2+'/21</div></td><td><div class="hit-cell '+hitClass(p3)+'">'+p3+'/21</div></td><td><div class="hit-cell '+hitClass(p4)+'">'+p4+'/21</div></td>';b.appendChild(tr);})}
function openWheeling(id,k){let p=pools.find(x=>x.id===id),w=p.wheelings.find(x=>x.k===k),combos=Ef(w.slice,uv(k));alert(p.label+' '+k+' si 4 - '+combos.length+' combos\nPrimera: '+combos[0].join('-')+'\nPara sorteo 12320')}
renderPools();renderResults();
</script>
</body>
</html>
