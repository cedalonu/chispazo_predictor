<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chispazo Predictor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#f5f5f7;padding:12px}
h1{font-size:20px;text-align:center;margin:10px 0 4px}
.sub{font-size:12px;text-align:center;color:#666;margin-bottom:12px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.real{border:2px solid #fdd835;background:#fffde7}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:#777;padding:6px;text-align:center}
td{padding:8px 4px;text-align:center;border-top:1px solid #eee}
.badge{display:inline-block;min-width:28px;padding:4px 6px;border-radius:6px;font-weight:700;color:#fff}
.ok4{background:#556b2f}.ok5{background:#6a1b9a}.ok0{background:#ddd;color:#777}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:99}
#modal.show{display:flex} #modal.box{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:16px;max-height:85vh;overflow:auto}
.chip{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:8px;font-weight:800;margin:3px;background:#eee}
.chip.hit{background:#c6f6d5;border:2px solid #38a169}.chip.hit5{background:#e1bee7;border:2px solid #6a1b9a}
</style>
</head>
<body>
<h1>🎯 Chispazo Predictor</h1>
<p class="sub">Pool = próximos 5 · Pool2 = 6 al 26 · Datos de pakinja/pakin</p>

<div class="card real">
<h3>Sorteo real para comparar</h3>
<div style="display:flex;gap:6px;justify-content:center;margin:8px 0">
<input id="r1" type="number" placeholder="1" style="width:18%;padding:8px;border-radius:8px;border:1px solid #ddd;text-align:center">
<input id="r2" type="number" placeholder="11" style="width:18%;padding:8px;border-radius:8px;border:1px solid #ddd;text-align:center">
<input id="r3" type="number" placeholder="15" style="width:18%;padding:8px;border-radius:8px;border:1px solid #ddd;text-align:center">
<input id="r4" type="number" placeholder="20" style="width:18%;padding:8px;border-radius:8px;border:1px solid #ddd;text-align:center">
<input id="r5" type="number" placeholder="27" style="width:18%;padding:8px;border-radius:8px;border:1px solid #ddd;text-align:center">
</div>
<button onclick="comparar()" style="width:100%;padding:10px;background:#000;color:#fff;border:0;border-radius:8px;font-weight:700">Comparar</button>
<div id="realNums" style="display:flex;gap:6px;justify-content:center;margin-top:8px"></div>
</div>

<div class="card">
<h3>Tabla (toca fila para detalle) · 4=verde militar · 5=morado</h3>
<table><thead><tr><th>Combo</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead><tbody id="tbody"></tbody></table>
<a href="https://chat.whatsapp.com/TU_LINK" target="_blank" style="display:block;background:#25D366;color:#fff;text-align:center;padding:12px;border-radius:10px;text-decoration:none;font-weight:700;margin-top:10px">Unidos contra el chispazo</a>
</div>

<div id="modal" onclick="if(event.target==this)closeM()"><div class="box"><button onclick="closeM()" style="float:right;border:0;background:#eee;border-radius:20px;width:28px;height:28px">✕</button><h4 id="mTitle"></h4><div id="mBody"></div></div></div>

<script>
const url='https://raw.githubusercontent.com/pakinja/pakin/master/Chispazo.csv';
let combos=[], real=[1,11,15,20,27], histAll=[];
async function load(){
  const txt=await (await fetch(url)).text();
  const lines=txt.trim().split('\n').slice(1);
  histAll=lines.map(l=>{const p=l.split(','); return p.slice(-5).map(Number)}).filter(a=>a.length==5);
  const freq={}; histAll.flat().forEach(n=>freq[n]=(freq[n]||0)+1);
  const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]).map(x=>+x[0]);
  combos=[]; for(let i=0;i<21;i++){ let c=[]; for(let j=0;j<5;j++) c.push(sorted[(i*2+j)%sorted.length]||j+1); c=[...new Set(c)].slice(0,5); while(c.length<5){c.push(Math.floor(Math.random()*28)+1); c=[...new Set(c)]} combos.push(c.sort((a,b)=>a-b)); }
  render();
}
function hits(a,b){return a.filter(x=>b.includes(x)).length}
function render(){
  const pool2=histAll.slice(-21); const tb=document.getElementById('tbody'); tb.innerHTML='';
  combos.forEach((combo,i)=>{
    const counts=[0,0,0,0,0,0,0]; pool2.forEach(s=>counts[hits(combo,s)]++);
    const tr=document.createElement('tr'); tr.onclick=()=>openM(i,combo,pool2);
    tr.innerHTML=`<td><b>${i+1}</b><br><span style="font-size:10px;color:#666">${combo.join(',')}</span></td>`+[0,1,2,3,4,5].map(k=>`<td><span class="badge ${k==5?'ok5':k==4?'ok4':'ok0'}" style="${k>=4&&counts[k]>0?'':'opacity:.5'}">${counts[k]||0}</span></td>`).join(''); tb.appendChild(tr);
  });
  document.getElementById('realNums').innerHTML=real.map(n=>`<span style="background:#fdd835;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:800">${n}</span>`).join('');
}
function comparar(){ const vals=[+r1.value,+r2.value,+r3.value,+r4.value,+r5.value].filter(Boolean); if(vals.length==5) real=vals; render(); }
function openM(idx,combo,pool2){
  document.getElementById('mTitle').innerText=`Combo ${idx+1}: ${combo.join(', ')}`;
  let html=`<p style="font-size:12px;color:#666">Pool2 (últimos 10) - Verde=acierto</p>`;
  pool2.slice(-10).reverse().forEach(s=>{ html+=`<div style="margin:8px 0;padding:8px;background:#f9f9f9;border-radius:8px"><div style="font-size:11px">${s.join(', ')} → <b>${hits(combo,s)}/5</b></div><div>${s.map(n=>`<span class="chip ${combo.includes(n)?'hit':''}">${n}</span>`).join('')}</div></div>`});
  html+=`<hr><div><b>Vs tu ganador (${real.join(',')}): ${hits(combo,real)}/5</b><div>${combo.map(n=>`<span class="chip ${real.includes(n)?'hit':''}">${n}</span>`).join('')}</div></div>`;
  document.getElementById('mBody').innerHTML=html; document.getElementById('modal').classList.add('show');
}
function closeM(){document.getElementById('modal').classList.remove('show')}
load();
</script>

<!-- Contador INVISIBLE - solo tu ves las visitas en goatcounter.com -->
<script data-goatcounter="https://cedalonu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

</body>
</html>
