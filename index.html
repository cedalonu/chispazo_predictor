function renderPools(){const c=document.getElementById('pools');pools.forEach(p=>{let d=document.createElement('div');d.className='pool-card';d.style.borderColor=p.border;d.style.boxShadow=`0 0 14px ${p.border}33`;let nH=p.nums.map(n=>`<div class="num-cell" style="border-color:${p.border}55;color:${p.accent}">${String(n).padStart(2,'0')}</div>`).join('');let wH=p.wheelings.map(w=>`<button class="wheel-btn" style="border-color:${p.border}88;background:${p.border}22;color:${p.accent}" onclick="openWheeling('${p.id}',${w.k})">${uv(w.k)} si 4</button>`).join('');d.innerHTML=`<div style="display:flex;justify-content:space-between"><span style="font-size:11px;font-weight:800;color:${p.accent}">${p.label}</span><span class="pill" style="background:${p.border}22;border:1px solid ${p.border}66;color:${p.accent};font-size:10px">${p.count} #</span></div><div class="num-grid">${nH}</div><div style="margin-top:6px"><span style="font-size:9px;color:var(--yellow)">● WHEELINGS</span><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${wH}</div></div>`;c.appendChild(d);})}
function hitClass(c){if(c>=5)return 'hit-5';if(c===4)return 'hit-4';if(c===3)return 'hit-3';return 'hit-0'}
function renderResults(){
 const b=document.getElementById('results-body');b.innerHTML='';
 sorteos.forEach(s=>{
 let hist = window.HIST_POOLS[s.num];
 let pFinal = hist ? hist.Tr : pools[0].nums;
 let p2 = hist ? hist.zr : pools[1].nums;
 let p3 = hist ? hist.Lr : pools[2].nums;
 let p4 = hist ? hist.Rr : pools[3].nums;
 let pf=hitsCount(pFinal,s.win),c2=hitsCount(p2,s.win),c3=hitsCount(p3,s.win),c4=hitsCount(p4,s.win);
 let tr=document.createElement('tr');
 tr.innerHTML=`<td style="padding:10px 4px;font-weight:900;font-size:12px">${s.num}</td><td><div class="hit-cell ${hitClass(pf)}" onclick="openCellPopout(${s.num},'final')">${pf}/16</div></td><td><div class="hit-cell ${hitClass(c2)}" onclick="openCellPopout(${s.num},'p2')">${c2}/21</div></td><td><div class="hit-cell ${hitClass(c3)}" onclick="openCellPopout(${s.num},'p3')">${c3}/21</div></td><td><div class="hit-cell ${hitClass(c4)}" onclick="openCellPopout(${s.num},'p4')">${c4}/21</div></td>`;
 b.appendChild(tr);
 });
}
function openWheeling(id,k,sorteoNum){
 let p=pools.find(x=>x.id===id),w=p.wheelings.find(x=>x.k===k);
 let slice=w.slice;
 let win=null,winDate='';
 // Si es de resultados, usar pool 
 if(sorteoNum && window.HIST_POOLS[sorteoNum]){
 let hist=window.HIST_POOLS[sorteoNum];
 let map={final:hist.Tr,p2:hist.zr,p3:hist.Lr,p4:hist.Rr};
 if(map[id]) slice=map[id].slice(0,w.slice.length);
 }
 let total=gf(slice.length,5),reduced=uv(k);
 if(sorteoNum){let s=sorteos.find(x=>x.num===sorteoNum);if(s){win=s.win;winDate=s.date;}}
 let combos = win ? rv(slice,win,reduced) : Ef(slice,reduced);
 let winHtml= win?`<div style="background:var(--yellow);color:black;border-radius:10px;padding:10px;text-align:center"><div style="font-size:10px;font-weight:900">● GANADORES REALES - SORTEO ${sorteoNum}</div><div style="font-size:20px;font-weight:900">${win.map(n=>String(n).padStart(2,'0')).join(' ')}</div><div style="font-size:10px">${winDate}</div></div>`:`<div style="background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:8px;text-align:center"><div style="font-size:10px;color:#888">Wheeling ${k} si 4 - ${slice.length} números base - Sorteo 12321</div></div>`;
 let poolBaseHtml=`<div style="margin-top:10px;border:1px solid ${p.border}44;border-radius:10px;padding:8px;background:#1a1a1a"><div style="font-size:10px;font-weight:800;color:${p.accent}">POOL BASE ${sorteoNum?' '+sorteoNum:'ACTUAL 12321'}</div><div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:6px">${slice.map(n=>{let isW=win?win.includes(n):false;return `<span style="background:${isW?'#2e7d32':'#1a1a1a'};border:1px solid ${isW?'#4caf50':'#333'};color:${isW?'white':p.accent};border-radius:5px;padding:2px 5px;font-size:11px;font-weight:800">${String(n).padStart(2,'0')}</span>`}).join('')}</div></div>`;
 let listHtml=combos.map((c,i)=>{let hits=win?c.filter(n=>win.includes(n)).length:0;return `<div style="display:flex;gap:6px;align-items:center;padding:5px 8px;margin:3px 0;background:#1a1a1a;border:1px solid #333;border-radius:8px"><span style="font-size:10px;background:#222;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center">${i+1}</span><div style="display:flex;gap:3px">${c.map(n=>{let isWin=win?win.includes(n):false;return `<span style="background:${isWin?'#2e7d32':'#222'};border:1px solid ${isWin?'#4caf50':'#333'};color:${isWin?'white':'#ccc'};border-radius:5px;padding:2px 5px;font-size:11px;font-weight:900">${String(n).padStart(2,'0')}</span>`}).join('')}</div><span style="margin-left:auto;background:${hits>=4?'#2e7d32':'#424242'};color:white;border-radius:999px;padding:2px 8px;font-size:10px">${win?hits+' ac':''}</span></div>`}).join('');
 let copyText = combos.map((c,i)=>`${String(i+1).padStart(4,'0')}: ${c.map(n=>String(n).padStart(2,'0')).join('-')} ${win?'- '+c.filter(n=>win.includes(n)).length+'ac':''}`).join('\n');
 let htmlModal=`<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div style="padding:10px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between"><span style="font-size:10px" class="mono">Wheeling ${id} - ${uv(k)} si 4 - ${sorteoNum?'Sorteo '+sorteoNum:'Sorteo 12321'}</span><button onclick="closeModal()" style="background:#2a2a2a;border:1px solid #555;color:white;border-radius:50%;width:26px;height:26px">×</button></div><div class="modal-scroll">${winHtml}${poolBaseHtml}<div style="margin-top:10px"><button onclick="navigator.clipboard.writeText(\`${copyText}\`).then(()=>alert('Copiado ${reduced} combinaciones - Pool ${sorteoNum||12321} distinto'))" style="background:var(--yellow);color:black;border:0;border-radius:999px;padding:6px 14px;font-size:11px;font-weight:900;width:100%">COPIAR PORTAPAPELES - ${reduced} combinaciones </button></div><div style="margin-top:8px">${listHtml}</div></div><div style="padding:8px;background:#0f0f0f;border-top:1px solid #222;display:flex;justify-content:center"><button onclick="closeModal()" style="background:#222;border:1px solid #444;color:#ccc;border-radius:999px;padding:6px 14px;font-size:11px">CERRAR [Esc]</button></div></div></div>`;
 document.getElementById('modal-root').innerHTML=htmlModal;
}
function openCellPopout(num,pid){
 let s=sorteos.find(x=>x.num===num);
 let hist=window.HIST_POOLS[num];
 let pActual=pools.find(x=>x.id===pid);
 let poolNums = hist ? (pid==='final'?hist.Tr:pid==='p2'?hist.zr:pid==='p3'?hist.Lr:hist.Rr) : pActual.nums;
 let p={...pActual,nums:poolNums,wheelings:poolNums ? [{k:14,slice:poolNums.slice(0,14)},{k:16,slice:poolNums.slice(0,16)},{k:18,slice:poolNums.slice(0,18)},{k:21,slice:poolNums}] : pActual.wheelings};
 let win=s.win;
 let ph=win.filter(n=>p.nums.includes(n));
 let grid=p.nums.map(n=>`<div class="num-cell" style="background:${win.includes(n)?'#2e7d32':'var(--card)'};border-color:${win.includes(n)?'#4caf50':'#333'};color:${win.includes(n)?'white':p.accent}">${String(n).padStart(2,'0')}</div>`).join('');
 let wr='';
 p.wheelings.forEach(w=>{
 let combos=rv(w.slice,win,uv(w.k));
 let sc=combos.map(c=>({c,h:hitsCount(c,win)})).sort((a,b)=>b.h-a.h);
 let best=sc[0]?.h||0;
 let top=sc.slice(0,3);
 let bt=top.map((it,idx)=>`<div style="display:flex;gap:4px;margin:4px 0"><span style="font-size:10px;background:#222;border-radius:4px;padding:1px 4px">${idx+1}</span><div style="display:flex;gap:2px">${it.c.map(n=>`<span style="background:${win.includes(n)?'#2e7d32':'#1a1a1a'};border:1px solid #333;border-radius:4px;padding:2px 4px;font-size:11px">${String(n).padStart(2,'0')}</span>`).join('')}</div><span style="margin-left:auto;background:${it.h>=4?'#2e7d32':'#424242'};color:white;border-radius:999px;padding:2px 8px;font-size:10px">${it.h} ac</span></div>`).join('');
 wr+=`<div style="margin-top:12px;border:1px solid #2a2a2a;border-radius:10px;padding:8px;background:#1a1a1a"><div style="display:flex;justify-content:space-between"><span style="font-size:11px;font-weight:900;color:${p.accent}">${uv(w.k)} si 4 - ${hist?' '+num:'Actual'}</span><span style="font-size:10px;color:#aaa">Mejor ${best} ac</span></div>${bt}<div style="text-align:center;margin-top:8px"><button onclick="openWheeling('${pid}',${w.k},${s.num})" style="background:#222;border:1px solid #333;color:#aaa;border-radius:999px;padding:4px 12px;font-size:10px">Ver Wheeling ${uv(w.k)} si 4 ↗</button></div></div>`;
 });
 let html=`<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><div style="padding:10px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between"><span style="font-size:12px;font-weight:900">Sorteo ${s.num} - ${p.label}</span><button onclick="closeModal()" style="background:#2a2a2a;border:1px solid #555;color:white;border-radius:50%;width:26px;height:26px">×</button></div><div class="modal-scroll"><div style="background:var(--yellow);color:black;border-radius:10px;padding:10px;text-align:center"><div style="font-size:10px;font-weight:900">● GANADORES REALES</div><div style="font-size:20px;font-weight:900">${win.map(n=>String(n).padStart(2,'0')).join(' ')}</div><div style="font-size:10px">${s.date}</div></div><div style="margin-top:12px;border:1px solid ${p.border}66;border-radius:10px;padding:10px;background:#1a1a1a"><div style="display:flex;justify-content:space-between"><span style="font-size:11px;font-weight:900;color:${p.accent}">POOL ${pid.toUpperCase()} (${p.count}) - ${ph.length} aciertos -</span><span class="pill" style="background:#2e7d32;color:white">${ph.length}/${p.count}</span></div><div class="num-grid" style="margin-top:8px">${grid}</div></div><div style="margin-top:12px"><div style="font-size:11px;font-weight:900">WHEELINGS - RESULTADOS</div>${wr}</div></div><div style="padding:8px;background:#0f0f0f;border-top:1px solid #222;display:flex;justify-content:center"><button onclick="closeModal()" style="background:#222;border:1px solid #444;color:#ccc;border-radius:999px;padding:4px 12px;font-size:10px">CERRAR</button></div></div></div>`;
 document.getElementById('modal-root').innerHTML=html;
}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function downloadTXT(){let txt=pools[0].nums.join(',');let blob=new Blob([txt],{type:'text/plain'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='12321.txt';a.click();}
function downloadCSV(){let csv=pools[0].nums.join(',');let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='12321.csv';a.click();}
renderPools();renderResults();
</script>
</body>
</html>
